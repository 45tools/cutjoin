<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="45 Cut&amp;Join">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>45 Cut &amp; Join</title>
<style>
:root{
  --bg:#141a26; --panel:#1f2636; --panel2:#2a3246; --line:#36405a;
  --text:#f3f5fa; --sub:#a3acc2; --accent:#ff6a3d; --accent-d:#d9481f; --sky:#3fb0ff; --sky-d:#1f86d1;
  --star:#ffc94d; --star-d:#e0a21a; --mint:#3ddc97; --mint-d:#1fae70; --pink:#ff6b9a; --pink-d:#d94477; --purple:#9b7dff; --purple-d:#7356e0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,select,a,summary,label{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Arial Rounded MT Bold","PingFang TC","PingFang SC",-apple-system,sans-serif;}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
select,button{font:inherit;color:inherit}
.ic{display:inline-flex;width:1.25em;height:1.25em;flex:none}
.ic svg{width:100%;height:100%}
header{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
header h1{font-size:18px;margin:0;font-weight:800;white-space:nowrap;letter-spacing:.01em}
header h1 .n{color:var(--accent)}
header .sp{flex:1}
.hbtn{background:var(--panel2);border:none;border-radius:12px;padding:7px 10px;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.wrap{max-width:900px;margin:0 auto;padding:0 12px calc(100px + env(safe-area-inset-bottom))}

/* モード切り替え */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--panel);border-radius:18px;padding:5px;margin:4px 0 10px}
.modes button{border:none;background:none;border-radius:14px;padding:9px 4px;font-size:14px;font-weight:700;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px}
.modes button .ic{width:20px;height:20px}
body[data-mode="watch"] .modes [data-mode="watch"]{background:var(--sky);color:#fff;box-shadow:0 3px 0 var(--sky-d)}
body[data-mode="cut"] .modes [data-mode="cut"]{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-d)}
body[data-mode="star"] .modes [data-mode="star"]{background:var(--star);color:#3a2a00;box-shadow:0 3px 0 var(--star-d)}
.pane{display:none}
body[data-mode="watch"] .pane[data-pane="watch"],body[data-mode="cut"] .pane[data-pane="cut"],body[data-mode="star"] .pane[data-pane="star"]{display:block}
.modetip{color:var(--sub);font-size:13px;line-height:1.6;margin:10px 4px 0}

/* プレーヤー */
#stage{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;touch-action:pan-y}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;visibility:hidden;pointer-events:none}
#stage video.on{visibility:visible}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--sub);text-align:center;padding:16px;background:radial-gradient(circle at 50% 40%,#26304a,#11151f)}
#empty .big{font-size:15px;color:var(--text)}
.linkbtn{background:none;border:none;color:var(--sky);font-size:13px;text-decoration:underline;padding:4px}
.ripple{position:absolute;top:0;bottom:0;width:40%;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}
.ripple.l{left:0;border-radius:0 50% 50% 0;background:radial-gradient(circle at 30% 50%,rgba(255,255,255,.2),transparent 70%)}
.ripple.r{right:0;border-radius:50% 0 0 50%;background:radial-gradient(circle at 70% 50%,rgba(255,255,255,.2),transparent 70%)}
.ripple.show{opacity:1}
.ripple span{background:rgba(0,0,0,.55);padding:8px 14px;border-radius:20px;font-weight:800;font-size:15px}
#centerIcon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:64px;height:64px;border-radius:32px;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:28px;opacity:0;transition:opacity .3s;pointer-events:none;padding:0 18px;white-space:nowrap;z-index:6}
#centerIcon.msg{font-size:14px;font-weight:700}
#centerIcon.show{opacity:1}
#timeBadge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:10px;font-variant-numeric:tabular-nums;font-size:13px;pointer-events:none}
#segBadge{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:10px;font-size:12px;pointer-events:none}
/* アプリ内の全画面 */
#fsBar{display:none}
body.fsmode{overflow:hidden}
body.fsmode #stage{position:fixed;inset:0;z-index:60;border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;height:100dvh}
body.fsmode #fsBar{display:flex;position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));gap:10px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.75));z-index:5;transition:opacity .3s}
body.fsmode #fsBar.hide{opacity:0;pointer-events:none}
#fsBar button{width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
#fsBar button .ic{width:24px;height:24px}
#fsBar #fsPlay{background:var(--accent)}
#fsBar #fsStar{background:var(--star);color:#3a2a00}
#fsBar .t{flex:1;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}

/* 再生操作 */
.transport{display:flex;align-items:center;gap:8px;margin-top:10px}
.time{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.time b{font-weight:800}
.time .tot{color:var(--sub)}
.round{width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 0 var(--accent-d)}
.round .ic{width:24px;height:24px}
.round.sec{background:var(--panel2);box-shadow:0 3px 0 #1a2030;font-size:13px;font-weight:800}
.round:disabled{opacity:.35}
.round:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.transport .sp{flex:1}

/* タイムライン */
#timeline{position:relative;height:64px;margin-top:12px;background:var(--panel);border-radius:14px;overflow:hidden;touch-action:none}
.seg{position:absolute;top:8px;bottom:8px;border-radius:9px;overflow:hidden;display:flex;align-items:flex-end;padding:3px 5px;font-size:10px;color:rgba(255,255,255,.95);border:2px solid transparent;background-size:cover;background-position:center}
.seg.sel{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
.seg .lbl{background:rgba(0,0,0,.55);border-radius:6px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-weight:700}
#playhead{position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.8);pointer-events:none;z-index:3}
#playhead::before{content:"";position:absolute;top:-1px;left:-6px;border:7px solid transparent;border-top-color:#fff}
#range{position:absolute;top:0;bottom:0;background:rgba(255,107,154,.32);border-left:3px solid var(--pink);border-right:3px solid var(--pink);pointer-events:none;display:none;z-index:1}
#range.on{display:block}
#range.noL{border-left:none}#range.noR{border-right:none}
.mk{position:absolute;top:0;bottom:0;width:2px;background:var(--star);z-index:2;pointer-events:none}
.mk::after{content:"★";position:absolute;top:-2px;left:-6px;font-size:13px;color:var(--star);text-shadow:0 0 3px #000}
.tlhint{color:var(--sub);font-size:11px;margin:6px 2px 0;text-align:center}

/* ポップなボタン */
.pop{border:none;border-radius:18px;padding:14px 8px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;background:var(--panel2);box-shadow:0 4px 0 #1a2030}
.pop .ic{width:24px;height:24px}
.pop:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #1a2030}
.pop:disabled{opacity:.35}
.pop.orange{background:var(--accent);box-shadow:0 4px 0 var(--accent-d)}
.pop.yellow{background:var(--star);color:#3a2a00;box-shadow:0 4px 0 var(--star-d)}
.pop.sky{background:var(--sky);box-shadow:0 4px 0 var(--sky-d)}
.row2{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}
.row2 .undo{padding:14px 18px}

/* 小さい丸アイコンボタン */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiles.c3{grid-template-columns:repeat(3,1fr)}
.tile{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--text);padding:4px 0}
.tile .bub{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.tile .bub .ic{width:26px;height:26px}
.tile:active:not(:disabled) .bub{transform:translateY(2px);box-shadow:none}
.tile:disabled{opacity:.35}
.b-orange{background:var(--accent)}.b-sky{background:var(--sky)}.b-mint{background:var(--mint)}.b-pink{background:var(--pink)}.b-purple{background:var(--purple)}.b-star{background:var(--star);color:#3a2a00!important}.b-gray{background:var(--panel2)}
.tile.on .bub{outline:3px solid #fff;outline-offset:2px}
.tile.setp .bub{outline:3px solid var(--pink);outline-offset:2px}

.card2{margin-top:14px;background:var(--panel);border-radius:20px;padding:14px}
.card2 h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.card2 h3 .ic{width:20px;height:20px}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.selhead{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:12px}
.selhead .dot{width:14px;height:14px;border-radius:5px;flex:none}
.selhead .info{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums;margin-left:auto;text-align:right;white-space:pre-line}

/* ★の秒数設定 */
.len{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 6px}
.stepper{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.stepper .lab{font-size:12px;color:var(--sub);font-weight:700}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:50%;border:none;background:var(--panel2);font-size:20px;font-weight:800;box-shadow:0 3px 0 #1a2030}
.stepper button:active{transform:translateY(2px);box-shadow:none}
.stepper .v{min-width:56px;text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.bigstar{font-size:34px;color:var(--star);text-shadow:0 3px 0 var(--star-d)}
.lenbar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:8px 4px 4px;background:var(--panel2)}
.lenbar .a{background:var(--sky)}.lenbar .s{width:4px;background:var(--star)}.lenbar .b{background:var(--mint)}
.lensum{text-align:center;color:var(--sub);font-size:12px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:2px;background:#3a3216;color:var(--star);border-radius:14px;padding:6px 4px 6px 12px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.chip button{background:none;border:none;color:#c9b27a;padding:0 6px;display:flex}
.chip button .ic{width:16px;height:16px}

.foot{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap}
.support{background:transparent;border:2px solid var(--accent);color:var(--accent);border-radius:20px;padding:8px 18px;font-size:13px;font-weight:700;text-decoration:none}
.brand{color:var(--sub);font-size:11px;text-align:center;margin-top:10px}

/* 下部の保存ボタン */
.savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:20}
.savebar button{width:100%;max-width:876px;margin:0 auto;font-size:17px;padding:15px}
body[data-mode="watch"] .savebar{display:none}

/* シート・ダイアログ */
.overlay{position:fixed;inset:0;background:rgba(5,8,15,.7);display:none;align-items:flex-end;justify-content:center;z-index:70}
.overlay.show{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:19px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:none;border-radius:18px;padding:13px 14px;margin-bottom:10px;box-shadow:0 3px 0 #1a2030}
.opt .bub{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.opt .bub .ic{width:24px;height:24px}
.opt b{display:block;font-size:15px}
.opt small{display:block;color:var(--sub);font-size:12px;margin-top:3px;font-weight:500}
.opt:active{transform:translateY(2px);box-shadow:none}
.opts-lbl{color:var(--sub);font-size:12px;font-weight:700;margin:14px 2px 6px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel2);border-radius:14px;padding:4px}
.seg2 button{border:none;background:none;border-radius:11px;padding:9px 4px;font-size:12px;font-weight:700;color:var(--sub);line-height:1.35}
.seg2 button.on{background:var(--sky);color:#fff}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;margin:14px 2px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.closeb{display:block;width:100%;background:none;border:2px solid var(--line);border-radius:14px;padding:11px;font-size:14px;font-weight:700;color:var(--sub);margin-top:6px}
.help{line-height:1.7;font-size:14px}
.help h3{font-size:14px;margin:16px 0 4px;color:var(--accent)}
.help ol,.help ul{margin:0;padding-left:20px}
.help li{margin:3px 0}
.help .note{background:var(--panel2);border-radius:12px;padding:10px 12px;color:var(--sub);font-size:13px;margin-top:6px}

#modal{position:fixed;inset:0;background:rgba(5,8,15,.7);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
#modal.show{display:flex}
.card{background:var(--panel);border-radius:22px;padding:20px;max-width:420px;width:100%}
.card h2{margin:0 0 10px;font-size:18px}
.card p{color:var(--sub);font-size:13px;line-height:1.65;margin:8px 0;white-space:pre-line}
.bar{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.mrow{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.btn{border:none;border-radius:16px;padding:13px 16px;background:var(--panel2);font-size:15px;font-weight:700;box-shadow:0 3px 0 #1a2030}
.btn.pri{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-d)}
#exportCanvas{display:none}
</style>
</head>
<body data-mode="watch">
<header>
  <h1><span class="n">45</span> Cut &amp; Join</h1>
  <div class="sp"></div>
  <button class="hbtn" id="helpBtn" aria-label="help"><i class="ic" data-ic="help"></i><span data-i="helpShort"></span></button>
  <select id="lang" class="hbtn" aria-label="Language">
    <option value="ja">日本語</option><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh">简体中文</option>
  </select>
</header>

<div class="wrap">
  <nav class="modes">
    <button data-mode="watch"><i class="ic" data-ic="eye"></i><span data-i="mWatch"></span></button>
    <button data-mode="cut"><i class="ic" data-ic="scissors"></i><span data-i="mCut"></span></button>
    <button data-mode="star"><i class="ic" data-ic="star"></i><span data-i="mStar"></span></button>
  </nav>

  <div id="stage">
    <div id="empty">
      <div class="big" data-i="emptyTitle"></div>
      <button class="pop orange" id="addFirst" style="padding:14px 26px"><i class="ic" data-ic="film"></i><span data-i="addVideo"></span></button>
      <div data-i="emptySub" style="font-size:12px"></div>
      <button class="linkbtn" id="slowBtn" data-i="slowLink"></button>
    </div>
    <div class="ripple l" id="rl"><span>« 10s</span></div>
    <div class="ripple r" id="rr"><span>10s »</span></div>
    <div id="centerIcon"></div>
    <div id="timeBadge" hidden></div>
    <div id="segBadge" hidden></div>
    <div id="fsBar">
      <button id="fsExit" aria-label="exit"><i class="ic" data-ic="shrink"></i></button>
      <button id="fsBack" aria-label="-10s"><i class="ic" data-ic="back10"></i></button>
      <button id="fsPlay" aria-label="play"><i class="ic" data-ic="play"></i></button>
      <button id="fsFwd" aria-label="+10s"><i class="ic" data-ic="fwd10"></i></button>
      <span class="t" id="fsTime">0:00 / 0:00</span>
      <button id="fsStar" aria-label="mark"><i class="ic" data-ic="star"></i></button>
    </div>
  </div>

  <div class="transport">
    <button class="round sec" id="back10" aria-label="-10s"><i class="ic" data-ic="back10"></i></button>
    <button class="round" id="play" aria-label="play"><i class="ic" data-ic="play"></i></button>
    <button class="round sec" id="fwd10" aria-label="+10s"><i class="ic" data-ic="fwd10"></i></button>
    <div class="sp"></div>
    <div class="time"><b id="cur">0:00</b> <span class="tot">/ <span id="tot">0:00</span></span></div>
    <button class="round sec" id="speed">1x</button>
    <button class="round sec" id="fs" aria-label="fullscreen"><i class="ic" data-ic="expand"></i></button>
  </div>

  <div id="timeline"><div id="range"></div><div id="playhead" style="left:0"></div></div>
  <p class="tlhint" id="tlHint" data-i="tlHint"></p>

  <!-- 見る -->
  <section class="pane" data-pane="watch">
    <p class="modetip" data-i="tipWatch"></p>
    <div class="card2">
      <div class="tiles">
        <button class="tile" id="addBtn"><span class="bub b-sky"><i class="ic" data-ic="plus"></i></span><span data-i="addMore"></span></button>
        <button class="tile" id="sortBtn"><span class="bub b-purple"><i class="ic" data-ic="clock"></i></span><span data-i="sortDate"></span></button>
        <button class="tile" id="snapBtn"><span class="bub b-pink"><i class="ic" data-ic="camera"></i></span><span data-i="snap"></span></button>
        <button class="tile" id="muteBtn"><span class="bub b-mint"><i class="ic" id="muteIc" data-ic="sound"></i></span><span id="muteLbl"></span></button>
      </div>
    </div>
    <div class="card2" id="newCard">
      <button class="pop" id="newBtn" style="width:100%"><i class="ic" data-ic="refresh"></i><span data-i="startOver"></span></button>
    </div>
  </section>

  <!-- カット -->
  <section class="pane" data-pane="cut">
    <div class="row2">
      <button class="pop orange" id="splitBtn"><i class="ic" data-ic="scissors"></i><span data-i="cutHere"></span></button>
      <button class="pop undo" id="undoBtn"><i class="ic" data-ic="undo"></i><span data-i="undo"></span></button>
    </div>
    <div class="card2" id="selBox">
      <div id="selNone" class="muted" data-i="selNone"></div>
      <div id="selOn" hidden>
        <div class="selhead"><span class="dot" id="selDot"></span><b id="selTitle"></b><span class="info" id="selInfo"></span></div>
        <div class="tiles">
          <button class="tile" id="delBtn"><span class="bub b-pink"><i class="ic" data-ic="trash"></i></span><span data-i="del"></span></button>
          <button class="tile" id="leftBtn"><span class="bub b-sky"><i class="ic" data-ic="left"></i></span><span data-i="moveL"></span></button>
          <button class="tile" id="rightBtn"><span class="bub b-sky"><i class="ic" data-ic="right"></i></span><span data-i="moveR"></span></button>
          <button class="tile" id="saveOneBtn"><span class="bub b-mint"><i class="ic" data-ic="download"></i></span><span data-i="saveThis"></span></button>
        </div>
      </div>
    </div>
    <div class="card2">
      <h3><i class="ic" data-ic="eraser"></i><span data-i="rangeTitle"></span></h3>
      <p class="muted" data-i="rangeHelp" style="margin:0 0 12px"></p>
      <div class="tiles c3">

let lang = (()=>{try{return localStorage.getItem("cj_lang")}catch(e){return null}})() ||
  (()=>{ const n=(navigator.language||"ja").toLowerCase(); return n.startsWith("zh")?(/(tw|hk|mo|hant)/.test(n)?"zh-Hant":"zh"):n.startsWith("ja")?"ja":"en"; })();
if(!I18N[lang]) lang="ja";
const t = k => (I18N[lang]||I18N.ja)[k] || I18N.ja[k] || k;
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el=>{
    const v=t(el.dataset.i);
    el.textContent=v;
  });
  $("#helpBody").innerHTML=t("help");
  $("#lang").value=lang; renderList(); updateBadges(); if(document.getElementById("muteLbl")){ renderMute(); renderMarks(); renderDate(); $("#exportLbl").textContent=t(document.body.dataset.mode==="star"?"saveStar":"saveCut"); $("#previewBtn").lastChild.textContent=t(preview?"hlPreviewOff":"hlPreview"); }
}

/* ===== 状態 ===== */
const $ = s => document.querySelector(s);
const stage=$("#stage"), timeline=$("#timeline"), playhead=$("#playhead");
const COLORS=["#ff6a3d","#3da5ff","#3ddc97","#c77dff","#ffc94d","#ff5fa2","#4dd9e8","#a3e05b"];
let sources=[];   // {id,name,url,duration,video,color,thumb,w,h}
let segs=[];      // {id,src,start,end}
let cur=0;        // 現在のセグメントindex
let selected=-1;
let playing=false;
let rate=1;
let history=[];
let uid=1;
let exporting=null;
let rangeIn=null, rangeOut=null, muted=false;

const segLen = s => Math.max(0,s.end-s.start);
const total = () => segs.reduce((a,s)=>a+segLen(s),0);
const offsetOf = i => segs.slice(0,i).reduce((a,s)=>a+segLen(s),0);
const srcOf = s => sources.find(x=>x.id===s.src);
function fmt(sec){
  sec=Math.max(0,(sec||0)+0.05);
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=Math.floor(sec%60);
  return h? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;
}
function snapshot(){ history.push(JSON.stringify({segs,cur,selected})); if(history.length>50) history.shift(); }

$("#addFirst").onclick=$("#addBtn").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
  const files=[...e.target.files]; e.target.value="";
  if(!files.length) return;
  const wasEmpty=!segs.length;
  if(wasEmpty) resetAll(); else snapshot();   // 前の動画をメモリから解放してから読み込む
  clearRange();
  let done=0; const show=()=>{ $("#empty .big").textContent=`${t("loading")} ${done}/${files.length}`; }; show();
  const results=await Promise.allSettled(files.map(f=>loadSource(f).finally(()=>{ done++; show(); })));
  results.forEach((r,i)=>{
    if(r.status==="fulfilled") segs.push({id:uid++,src:r.value.id,start:0,end:r.value.duration});
    else alert(t("errLoad")+files[i].name+"\n("+(r.reason&&r.reason.message||"")+")");
  });
  $("#empty .big").textContent=t("emptyTitle");
  if(wasEmpty && segs.length){ cur=0; selected=document.body.dataset.mode==="cut"?0:-1; await activate(0,segs[0].start); }
  refresh();
};
// iPhone対策：動画要素を先に画面へ置いてから読み込む。
// メタデータが来なくても、MP4/MOVなら自前の解析結果（長さ）で先に進む。
async function loadSource(file){
  let mp4=null; try{ mp4=await MP4Cut.parse(file); }catch(e){ mp4=null; }
  const v=document.createElement("video");
  v.playsInline=true; v.muted=muted; v.preload="auto";
  v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline","");
  stage.insertBefore(v,$("#rl"));
  const url=URL.createObjectURL(file);
  v.src=url; try{ v.load(); }catch(e){}
  const meta=await new Promise(res=>{
    let done=false; const fin=x=>{ if(!done){ done=true; res(x); } };
    v.addEventListener("loadedmetadata",()=>fin("ok"),{once:true});
    v.addEventListener("error",()=>fin("error"),{once:true});
    setTimeout(()=>fin("timeout"),mp4?300:6000); // MP4/MOVは自前の解析で長さが分かるので待たない
  });
  let dur=(meta==="ok"&&isFinite(v.duration)&&v.duration>0)?v.duration:NaN;
  if(!isFinite(dur)&&mp4&&meta!=="error") dur=mp4.duration;
  if(!isFinite(dur)||dur<=0){
    const code=v.error?(" code "+v.error.code):"";
    v.remove(); URL.revokeObjectURL(url);
    throw new Error(meta+code);
  }
  const created=(mp4&&mp4.created)||null;
  const src={id:uid++,name:file.name,file,mp4,url,duration:dur,video:v,color:COLORS[sources.length%COLORS.length],w:v.videoWidth,h:v.videoHeight,thumb:null,created};
  if(!src.w) v.addEventListener("loadedmetadata",()=>{ src.w=v.videoWidth; src.h=v.videoHeight; },{once:true});
  src.key=file.size+"|"+dur.toFixed(1);
  const saved=mkAll()[src.key]; src.markers=saved?saved.t.slice():[];
  sources.push(src);
  v.addEventListener("timeupdate",()=>onTime(src));
  v.addEventListener("ended",()=>onEnded(src));
  makeThumb(src);
  return src;
}
function makeThumb(src){
  // 本体の動画に最初の映像が届いたら、そのコマをタイムライン用に縮小して使う（2本目の動画は開かない）
  const v=src.video;
  const grab=()=>{
    try{
      if(!v.videoWidth) return;
      const c=document.createElement("canvas"); const w=160, h=Math.round(160*(v.videoHeight/v.videoWidth||9/16));
      c.width=w; c.height=h; c.getContext("2d").drawImage(v,0,0,w,h);
      src.thumb=c.toDataURL("image/jpeg",.6); src.w=v.videoWidth; src.h=v.videoHeight; renderTimeline();
    }catch(e){}
  };
  if(v.readyState>=2) grab(); else v.addEventListener("loadeddata",grab,{once:true});
}

/* ===== 再生制御 ===== */
function activeVideo(){ const s=segs[cur]; return s? srcOf(s).video : null; }
async function activate(i,time){
  const s=segs[i]; if(!s) return;
  const prev=activeVideo();
  cur=i;
  const v=srcOf(s).video;
  if(prev && prev!==v){ prev.pause(); prev.classList.remove("on"); }
  v.classList.add("on");
  v.playbackRate=rate;
  if(Math.abs(v.currentTime-time)>0.05) await seekVideo(v,time);
  if(playing){ try{ await v.play(); }catch(e){ playing=false; } }
  updateUI();
}
function seekVideo(v,time){
  return new Promise(r=>{
    let done=false; const fin=()=>{ if(!done){done=true; r();} };
    v.addEventListener("seeked",fin,{once:true}); setTimeout(fin,800);
    v.currentTime=time;
  });
}
function onTime(src){
  const s=segs[cur]; if(!s||s.src!==src.id) return;
  if(src.video.currentTime>=s.end-0.03 && playing) advance();
  updateUI();
}
function onEnded(src){ const s=segs[cur]; if(s&&s.src===src.id&&playing) advance(); }
let advancing=false;
async function advance(){
  if(advancing) return; advancing=true;
  if(cur<segs.length-1){ await activate(cur+1,segs[cur+1].start); }
  else { setPlaying(false); const v=activeVideo(); if(v) v.pause(); }
  advancing=false;
}
function globalTime(){
  const s=segs[cur]; if(!s) return 0;
  const v=srcOf(s).video;
  return offsetOf(cur)+Math.min(segLen(s),Math.max(0,v.currentTime-s.start));
}
async function seekGlobal(g){
  if(!segs.length) return;
  g=Math.max(0,Math.min(total()-0.05,g));
  let acc=0;
  for(let i=0;i<segs.length;i++){
    const L=segLen(segs[i]);
    if(g<acc+L || i===segs.length-1){ await activate(i,segs[i].start+Math.min(L,g-acc)); break; }
    acc+=L;
  }
  updateUI();
}
function setPlaying(p){
  playing=p; const h=ico(p?"pause":"play"); $("#play").innerHTML=`<i class="ic">${h}</i>`; $("#fsPlay").innerHTML=`<i class="ic">${h}</i>`;
  if(document.body.classList.contains("fsmode")) showFsBar();
}
// iPhoneは「タップの処理の中で」始めた再生しか許さないため、待ち処理を挟まずに play() を呼ぶ
function togglePlay(){
  if(!segs.length) return;
  const v=activeVideo();
  if(playing){ setPlaying(false); v.pause(); flashCenter(ico("pause")); return; }
  if(globalTime()>=total()-0.1){ // 最後まで再生済みなら先頭へ（同期的に切り替え）
    const s0=segs[0], v0=srcOf(s0).video;
    if(v!==v0){ v.pause(); v.classList.remove("on"); }
    cur=0; v0.classList.add("on"); try{ v0.currentTime=s0.start; }catch(e){}
  }
  startPlay();
}
function startPlay(){
  const v=activeVideo(); if(!v) return;
  setPlaying(true); v.playbackRate=rate; v._unlocked=true;
  const p=v.play();
  if(p&&p.catch) p.catch(e=>{ if(activeVideo()===v){ setPlaying(false); toast(t("playErr")+" ("+e.name+")"); } });
  unlockOthers(v);
  flashCenter(ico("play"));
}
// 2本目以降の動画も、最初のタップのときに再生許可を得ておく（クリップをまたいだ自動再生のため）
function unlockOthers(except){
  sources.forEach(x=>{
    const o=x.video; if(o===except||o._unlocked) return;
    o._unlocked=true; const m=o.muted; o.muted=true;
    try{ const q=o.play(); if(q&&q.then) q.then(()=>{ if(o!==activeVideo()||!playing) o.pause(); o.muted=m; }).catch(()=>{ o.muted=m; o._unlocked=false; }); }catch(e){ o.muted=m; }
  });
}
fastTap($("#play"),togglePlay);
fastTap($("#back10"),()=>skip(-SKIP));
fastTap($("#fwd10"),()=>skip(SKIP));
fastTap($("#fsPlay"),()=>{ togglePlay(); showFsBar(); });
fastTap($("#fsBack"),()=>{ skip(-SKIP); showFsBar(); });
fastTap($("#fsFwd"),()=>{ skip(SKIP); showFsBar(); });
fastTap($("#fsStar"),()=>{ addMark(); showFsBar(); });
function skip(d){ if(!segs.length) return; seekGlobal(globalTime()+d); ripple(d>0?"r":"l"); }
$("#speed").onclick=()=>{
  const list=[1,1.5,2,0.5]; rate=list[(list.indexOf(rate)+1)%list.length];
  $("#speed").textContent=rate+"x"; const v=activeVideo(); if(v) v.playbackRate=rate;
};
// iPhoneの標準の全画面ではダブルタップが効かないため、アプリ内で画面いっぱいに広げる
function setFs(on){ document.body.classList.toggle("fsmode",on); if(on) showFsBar(); setTimeout(()=>{ renderTimeline(); updateUI(); },50); }
let fsTimer=null;
function showFsBar(){ const b=$("#fsBar"); b.classList.remove("hide"); clearTimeout(fsTimer); fsTimer=setTimeout(()=>{ if(playing) b.classList.add("hide"); },3000); }
$("#fs").onclick=()=>{ if(segs.length) setFs(true); };
$("#fsExit").onclick=()=>setFs(false);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") setFs(false); });

/* ダブルタップ判定（YouTube風） */
let lastTap={t:0,x:0,side:null}, tapTimer=null, chain=0;
function stageTap(clientX){
  if(!segs.length||exporting) return;
  if(document.body.classList.contains("fsmode")) showFsBar();
  const r=stage.getBoundingClientRect(); const x=clientX-r.left;
  const side = x<r.width*0.4?"l": x>r.width*0.6?"r":"c";
  const now=performance.now();
  if(now-lastTap.t<350 && side===lastTap.side && side!=="c"){
    chain++; skip(side==="r"?SKIP:-SKIP);
    showRippleCount(side,chain);
    lastTap={t:now,side};
    return;
  }
  chain=0;
  lastTap={t:now,side};
  if(side==="c") togglePlay();   // 待たずに実行（iPhoneの再生許可のため）
}
// タッチは touchend で処理して既定動作（ダブルタップ拡大）を止める。マウスは pointerup。
let touchStart=null;
stage.addEventListener("touchstart",e=>{ const p=e.changedTouches[0]; touchStart={x:p.clientX,y:p.clientY}; },{passive:true});
stage.addEventListener("touchend",e=>{
  if(e.target.closest("#empty")||e.target.closest("#fsBar")) return;   // 「動画を選ぶ」ボタンなどは通常どおり
  e.preventDefault();
  const p=e.changedTouches[0];
  if(touchStart&&Math.hypot(p.clientX-touchStart.x,p.clientY-touchStart.y)>12) return; // なぞっただけ
  stageTap(p.clientX);
},{passive:false});
$("#fsBar").addEventListener("touchend",e=>e.stopPropagation());
stage.addEventListener("pointerup",e=>{ if(e.pointerType!=="touch"&&!e.target.closest("#empty")&&!e.target.closest("#fsBar")) stageTap(e.clientX); });
// 連打するボタンも touchend で即実行（拡大させない・取りこぼさない）
function fastTap(el,fn){
  el.addEventListener("touchend",e=>{ e.preventDefault(); if(!el.disabled) fn(); },{passive:false});
  el.addEventListener("click",()=>{ if(!el.disabled) fn(); });   // タッチ時は touchend で既定動作を止めているので click は来ない
}
stage.addEventListener("dblclick",e=>e.preventDefault());
function ripple(side){
  const el=$(side==="r"?"#rr":"#rl"); el.classList.add("show");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),500);
}
function showRippleCount(side,n){
  const el=$(side==="r"?"#rr":"#rl");
  el.querySelector("span").textContent= side==="r"? `${(n)*SKIP}s »` : `« ${(n)*SKIP}s`;
  clearTimeout(el._c); el._c=setTimeout(()=>{ el.querySelector("span").textContent= side==="r"?"10s »":"« 10s"; },700);
}
function flashCenter(txt){
  const c=$("#centerIcon"); c.classList.remove("msg"); c.innerHTML=txt?`<i class="ic" style="width:30px;height:30px">${txt}</i>`:""; c.classList.add("show");
  clearTimeout(c._t); c._t=setTimeout(()=>c.classList.remove("show"),450);
}

/* ===== タイムライン ===== */
function renderTimeline(){
  timeline.querySelectorAll(".seg").forEach(n=>n.remove());
  const T=total(); if(!T) return;
  const W=timeline.clientWidth-8; let acc=0;
  segs.forEach((s,i)=>{
    const src=srcOf(s); const d=document.createElement("div");
    d.className="seg"+(i===selected?" sel":"");
    d.style.left=(4+acc/T*W)+"px"; d.style.width=Math.max(4,segLen(s)/T*W-2)+"px";
    d.style.backgroundColor=src.color;
    if(src.thumb) d.style.backgroundImage=`linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.35)),url(${src.thumb})`;
    d.innerHTML=`<span class="lbl">${i+1}</span>`;
    d.dataset.i=i;
    timeline.insertBefore(d,playhead);
    acc+=segLen(s);
  });
}
let dragging=false, downPos=null;
timeline.addEventListener("pointerdown",e=>{ if(!segs.length) return; dragging=true; downPos={x:e.clientX}; timeline.setPointerCapture(e.pointerId); scrub(e); });
timeline.addEventListener("pointermove",e=>{ if(dragging) scrub(e); });
timeline.addEventListener("pointerup",e=>{
  if(!dragging) return; dragging=false;
  if(Math.abs(e.clientX-downPos.x)<6){ // タップ＝選択
    const i=segIndexAtX(e.clientX); if(i>=0&&document.body.dataset.mode==="cut"){ selected=i; renderTimeline(); renderList(); refresh(); }
  }
});
function xToGlobal(clientX){
  const r=timeline.getBoundingClientRect(); const W=r.width-8;
  return Math.max(0,Math.min(1,(clientX-r.left-4)/W))*total();
}
function segIndexAtX(clientX){
  const g=xToGlobal(clientX); let acc=0;
  for(let i=0;i<segs.length;i++){ acc+=segLen(segs[i]); if(g<=acc) return i; } return segs.length-1;
}
let scrubPending=null, scrubBusy=false;
async function scrub(e){
  scrubPending=xToGlobal(e.clientX);
  movePlayhead(scrubPending);
  if(scrubBusy) return; scrubBusy=true;
  while(scrubPending!==null){ const g=scrubPending; scrubPending=null; await seekGlobal(g); }
  scrubBusy=false;
}
function movePlayhead(g){
  const T=total(); const W=timeline.clientWidth-8;
  playhead.style.left=(T? 4+g/T*W : 4)+"px";
}

/* ===== 編集 ===== */
// 全体時刻 g の位置で切る（キーフレームに合わせる）。切れ目のセグメント番号を返す
function splitAtGlobal(g){
  let acc=0;
  for(let i=0;i<segs.length;i++){
    const s=segs[i], L=segLen(s);
    if(g<=acc+L+1e-6){
      const src=srcOf(s); let at=s.start+(g-acc);
      if(src.mp4) at=MP4Cut.snap(src.mp4,at);
      if(at-s.start<0.3) return i;
      if(s.end-at<0.3) return i+1;
      segs.splice(i,1,{id:uid++,src:s.src,start:s.start,end:at},{id:uid++,src:s.src,start:at,end:s.end});
      if(cur>i) cur++;
      return i+1;
    }
    acc+=L;
  }
  return segs.length;
}
$("#splitBtn").onclick=async()=>{
  if(!segs.length) return;
  const n0=segs.length; snapshot();
  const idx=splitAtGlobal(globalTime());
  if(segs.length===n0){ history.pop(); toast(t("tooShort")); return; }
  selected=idx; await activate(idx,segs[idx].start);
  refresh();
};
$("#delBtn").onclick=async()=>{
  if(selected<0||!segs[selected]) return;
  snapshot(); clearRange();
  const wasPlaying=playing; if(playing){ setPlaying(false); activeVideo().pause(); }
  segs.splice(selected,1);
  if(!segs.length){ cur=0; selected=-1; sources.forEach(s=>s.video.classList.remove("on")); refresh(); return; }
  const g=offsetOf(Math.min(selected,segs.length-1));
  selected=Math.min(selected,segs.length-1);
  await seekGlobal(g); refresh();
  if(wasPlaying) togglePlay();
};
$("#leftBtn").onclick=()=>move(-1);
$("#rightBtn").onclick=()=>move(1);
async function move(d){
  const i=selected, j=i+d; if(i<0||j<0||j>=segs.length) return;
  snapshot(); clearRange();
  [segs[i],segs[j]]=[segs[j],segs[i]]; selected=j;
  if(cur===i) cur=j; else if(cur===j) cur=i;
  refresh();
}
$("#undoBtn").onclick=async()=>{
  const h=history.pop(); if(!h) return;
  const st=JSON.parse(h); segs=st.segs; selected=st.selected; clearRange();
  if(playing){ setPlaying(false); activeVideo()&&activeVideo().pause(); }
  sources.forEach(s=>s.video.classList.remove("on"));
  if(segs.length){ cur=Math.min(st.cur,segs.length-1); await activate(cur,segs[cur].start); }
  refresh();
};
/* ===== 範囲を削除 ===== */
function clearRange(){ rangeIn=rangeOut=null; renderRange(); }
function renderRange(){
  const r=$("#range"), T=total();
  $("#inBtn").classList.toggle("setp",rangeIn!==null); $("#outBtn").classList.toggle("setp",rangeOut!==null);
  if(!T||(rangeIn===null&&rangeOut===null)){ r.className=""; return; }
  const a=rangeIn??0, b=rangeOut??T, W=timeline.clientWidth-8;
  r.className="on"+(rangeIn===null?" noL":"")+(rangeOut===null?" noR":"");
  r.style.left=(4+a/T*W)+"px"; r.style.width=Math.max(2,(b-a)/T*W)+"px";
}
$("#inBtn").onclick=()=>{ if(!segs.length) return; rangeIn=globalTime(); if(rangeOut!==null&&rangeOut<rangeIn) rangeOut=null; toast(t("inSet")); refresh(); };
$("#outBtn").onclick=()=>{ if(!segs.length) return; rangeOut=globalTime(); if(rangeIn!==null&&rangeIn>rangeOut) rangeIn=null; toast(t("outSet")); refresh(); };
$("#rangeDelBtn").onclick=async()=>{
  if(rangeIn===null&&rangeOut===null){ toast(t("rangeNeed")); return; }
  const a=rangeIn??0, b=rangeOut??total(); if(b-a<0.3) return;
  if(playing){ setPlaying(false); activeVideo().pause(); }
  snapshot();
  const i=splitAtGlobal(a), j=splitAtGlobal(b);
  if(j<=i){ history.pop(); toast(t("tooShort")); return; }
  segs.splice(i,j-i); clearRange();
  sources.forEach(x=>x.video.classList.remove("on"));
  if(!segs.length){ cur=0; selected=-1; refresh(); return; }
  selected=Math.min(i,segs.length-1); cur=0;
  await seekGlobal(offsetOf(selected)); refresh();
};

/* ===== マーカー ===== */
const MK_KEY="cj_markers";
function mkAll(){ try{ return JSON.parse(localStorage.getItem(MK_KEY)||"{}"); }catch(e){ return {}; } }
function mkStore(){
  const all=mkAll();
  sources.forEach(x=>{ if(x.markers.length) all[x.key]={t:x.markers,u:Date.now()}; else delete all[x.key]; });
  const keys=Object.keys(all).sort((a,b)=>all[b].u-all[a].u); keys.slice(300).forEach(k=>delete all[k]); // 古いものだけ整理
  try{ localStorage.setItem(MK_KEY,JSON.stringify(all)); }catch(e){}
}
function visibleMarks(){
  const out=[]; let acc=0;
  segs.forEach((s,i)=>{ const src=srcOf(s);
    for(const t of src.markers) if(t>=s.start-0.01&&t<s.end) out.push({g:acc+(t-s.start),t,src,seg:i});
    acc+=segLen(s); });
  return out;
}
function renderMarks(){
  timeline.querySelectorAll(".mk").forEach(n=>n.remove());
  const T=total(), W=timeline.clientWidth-8, ms=visibleMarks();
  ms.forEach(m=>{ const d=document.createElement("div"); d.className="mk"; d.style.left=(4+m.g/T*W)+"px"; timeline.appendChild(d); });
  const box=$("#markChips"); box.innerHTML="";
  ms.forEach(m=>{
    const c=document.createElement("div"); c.className="chip";
    c.innerHTML=`<span>★ ${fmt(m.g)}</span><button aria-label="delete"><i class="ic">${ico("x")}</i></button>`;
    c.firstChild.onclick=()=>seekGlobal(m.g);
    c.querySelector("button").onclick=e=>{ e.stopPropagation(); m.src.markers=m.src.markers.filter(x=>x!==m.t); mkStore(); refresh(); };
    box.appendChild(c);
  });
  $("#noMarks").hidden=ms.length>0;
  renderLen();
}
// ★を付ける（ハイライトモード・全画面の★ボタン）
const markStack=[];
function addMark(){
  const s=segs[cur]; if(!s) return;
  const src=srcOf(s), tt=src.video.currentTime;
  if(src.markers.some(x=>Math.abs(x-tt)<0.5)) return;
  src.markers.push(tt); src.markers.sort((a,b)=>a-b); markStack.push({src,t:tt}); mkStore();
  toast(t("markAdded")); refresh();
}
fastTap($("#markBtn"),addMark);
$("#undoMarkBtn").onclick=()=>{
  const m=markStack.pop(); if(!m){ toast(t("markNone")); return; }
  m.src.markers=m.src.markers.filter(x=>x!==m.t); mkStore(); toast(t("markUndone")); refresh();
};
// ★の前後の秒数（＋−で選ぶ）
const LENS=[0,2,3,5,8,10,15,20,30,45,60];
const hl={pre:+(localStorage.getItem("cj_pre")||10), post:+(localStorage.getItem("cj_post")||5)};
function stepLen(k,d){
  let i=LENS.indexOf(hl[k]); if(i<0) i=LENS.findIndex(v=>v>=hl[k]);
  i=Math.max(0,Math.min(LENS.length-1,i+d)); hl[k]=LENS[i];
  if(hl.pre+hl.post<2) hl[k]=LENS[Math.min(LENS.length-1,i+1)];
  try{ localStorage.setItem("cj_"+k,hl[k]); }catch(e){}
  renderLen();
}
fastTap($("#preMinus"),()=>stepLen("pre",-1)); fastTap($("#prePlus"),()=>stepLen("pre",1));
fastTap($("#postMinus"),()=>stepLen("post",-1)); fastTap($("#postPlus"),()=>stepLen("post",1));
function renderLen(){
  $("#preV").textContent=hl.pre+t("secU"); $("#postV").textContent=hl.post+t("secU");
  const sum=hl.pre+hl.post||1; $("#lenA").style.flex=hl.pre/sum; $("#lenB").style.flex=hl.post/sum;
  const n=visibleMarks().length;
  if(n&&!preview){ const {parts}=highlightParts(); const d=parts.reduce((a,p)=>a+segLen(p),0); $("#lenSum").textContent=t("lenSum").replace("{n}",n).replace("{d}",fmt(d)); }
  else $("#lenSum").textContent=t("lenSumNone").replace("{a}",hl.pre).replace("{b}",hl.post).replace("{c}",hl.pre+hl.post);
}
// ★の前後の範囲（全体時刻）→ 元動画上のパーツ
function highlightParts(){
  const pre=hl.pre, post=hl.post, T=total();
  const rs=[]; visibleMarks().forEach(m=>{ const a=Math.max(0,m.g-pre), b=Math.min(T,m.g+post);
    if(rs.length&&a<=rs[rs.length-1][1]) rs[rs.length-1][1]=Math.max(rs[rs.length-1][1],b); else rs.push([a,b]); });
  const parts=[]; let acc=0;
  segs.forEach(s=>{ const Ls=segLen(s), src=srcOf(s);
    for(const [a0,b0] of rs){ const a=Math.max(a0,acc), b=Math.min(b0,acc+Ls); if(b-a<0.2) continue;
      let st=s.start+(a-acc), en=s.start+(b-acc);
      if(src.mp4){ st=Math.max(s.start,MP4Cut.snap(src.mp4,st)); if(en<s.end-0.05) en=Math.min(s.end,MP4Cut.snap(src.mp4,en)); }
      if(en-st>=0.3) parts.push({id:uid++,src:s.src,start:st,end:en}); }
    acc+=Ls; });
  return {parts,count:rs.length};
}

let audioCtx=null, audioDest=null;
function ensureAudio(){
  if(audioCtx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  audioCtx=new AC(); audioDest=audioCtx.createMediaStreamDestination();
  sources.forEach(hookAudio);
}
function hookAudio(src){
  if(src.audioNode||!audioCtx) return;
  try{
    src.audioNode=audioCtx.createMediaElementSource(src.video);
    src.audioNode.connect(audioCtx.destination);
    src.audioNode.connect(audioDest);
  }catch(e){}
}
function pickMime(){
  const c=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  if(!window.MediaRecorder) return null;
  for(const m of c){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return "";
}

/* ===== 高速保存（再エンコードなし） ===== */
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
const L=x=>typeof x==="number"?segs[x]:x;
function fastable(indices){
  const ms=[...new Set(indices.map(i=>srcOf(L(i)).mp4))];
  if(ms.some(m=>!m)) return "noparse";
  return MP4Cut.compatible(ms) ? "ok" : "mixed";
}
function buildFile(indices,name){
  const parts=indices.map(i=>{ const s=L(i); return {m:srcOf(s).mp4,start:s.start,end:s.end}; });
  const r=MP4Cut.build(parts,{mute:muted,dateNow});
  return new File([r.blob],`${name}.${r.ext}`,{type:r.mime});
}
function saveJoined(indices,tag){
  if(!indices.length) return;
  if(playing){ setPlaying(false); activeVideo().pause(); }
  const ok=fastable(indices);
  if(ok!=="ok"){ askCompat(ok,()=>doExport(indices)); return; }
  try{ showResult([buildFile(indices,"45cutjoin_"+(tag?tag+"_":"")+stamp())]); }
  catch(e){ askCompat("noparse",()=>doExport(indices)); }
}
function saveParts(indices,tag){
  if(!indices.length) return;
  if(playing){ setPlaying(false); activeVideo().pause(); }
  const bad=indices.filter(i=>fastable([i])!=="ok");
  if(bad.length){ askCompat("noparse",()=>doExport(bad)); return; }
  const st=stamp();
  showResult(indices.map((i,k)=>buildFile([i],`45cutjoin_${tag?tag+"_":""}${st}_${String(k+1).padStart(2,"0")}`)));
}
function askCompat(kind,go){
  showModal(t("compatTitle"),kind==="mixed"?t("compatText"):t("parseFail"),[{label:t("cancel")},{label:t("compatGo"),pri:true,fn:()=>setTimeout(go,0)}]);
}
// 共有できる形を探す（iPhoneは種類の判定が厳しいので、別の種類名でも試す）
function shareable(files){
  if(!navigator.share||!navigator.canShare) return null;
  const tries=[files,
    files.map(f=>f.type.startsWith("video/")?new File([f],f.name.replace(/\.\w+$/,".mp4"),{type:"video/mp4"}):f),
    files.map(f=>f.type.startsWith("video/")?new File([f],f.name.replace(/\.\w+$/,".mov"),{type:"video/quicktime"}):f)];
  for(const fs of tries){ try{ if(navigator.canShare({files:fs})) return fs; }catch(e){} }
  return null;
}
function showResult(files,kind){
  const btns=[], sh=shareable(files);
  if(sh) btns.push({label:"📷 "+t("savePhotos"),pri:true,keep:true,fn:()=>{
    navigator.share({files:sh}).catch(e=>{ if(e&&e.name!=="AbortError") showModal(t("fastTitle"),t("shareFail"),[{label:t("saveFiles"),fn:()=>files.forEach((f,i)=>setTimeout(()=>download(f,f.name),i*700))},{label:t("close")}]); });
  }});
  btns.push({label:"📁 "+t("saveFiles"),pri:!sh,keep:true,fn:()=>files.forEach((f,i)=>setTimeout(()=>download(f,f.name),i*700))});
  btns.push({label:t("close")});
  const sz=files.reduce((a,f)=>a+f.size,0)/1048576;
  const head=`${files.length>1?files.length+" files · ":""}${sz.toFixed(1)} MB${kind!=="snap"&&muted?t("mutedNote"):""}\n`;
  const body=kind==="snap"?t("snapText"):t("fastText");
  showModal(kind==="snap"?t("snapTitle"):t("fastTitle"),head+(sh?body:t("noShare")),btns);
}

async function doExport(indices){
  const mime=pickMime();
  const canvas=$("#exportCanvas");
  if(mime===null||!canvas.captureStream){ showModal(t("export"),t("noExport"),[{label:t("close")}]); return; }
  if(playing){ setPlaying(false); activeVideo().pause(); }
  ensureAudio(); sources.forEach(hookAudio);
  if(audioCtx.state==="suspended") await audioCtx.resume();

  // 出力サイズ：最初のクリップの解像度（長辺1920まで）
  const first=srcOf(L(indices[0]));
  let W=first.w||1280, H=first.h||720; const k=Math.min(1,1920/Math.max(W,H));
  W=Math.round(W*k/2)*2; H=Math.round(H*k/2)*2;
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);

  const stream=canvas.captureStream(30);
  if(!muted) audioDest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
  const opts=mime?{mimeType:mime,videoBitsPerSecond:8_000_000}:{};
  const rec=new MediaRecorder(stream,opts);
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };

  const totalLen=indices.reduce((a,i)=>a+segLen(L(i)),0);
  let doneLen=0, cancelled=false;
  exporting={cancel:()=>{cancelled=true;}};
  showModal(t("exporting"),t("exportText"),[{label:t("cancel"),fn:()=>exporting&&exporting.cancel()}],true);

  let drawing=true, curV=null;
  const draw=()=>{
    if(!drawing) return;
    if(curV && curV.readyState>=2){
      const vw=curV.videoWidth, vh=curV.videoHeight, s=Math.min(W/vw,H/vh);
      const dw=vw*s, dh=vh*s;
      ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
      ctx.drawImage(curV,(W-dw)/2,(H-dh)/2,dw,dh);
    }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
  rec.start(1000);
  const savedRate=rate;

  for(const i of indices){
    if(cancelled) break;
    const s=L(i), src=srcOf(s), v=src.video;
    rec.state==="recording" && rec.pause && rec.pause();
    sources.forEach(x=>{ if(x.video!==v){ x.video.pause(); x.video.classList.remove("on"); } });
    v.classList.add("on"); v.playbackRate=1;
    await seekVideo(v,s.start);
    curV=v;
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    rec.state==="paused" && rec.resume();
    try{ await v.play(); }catch(e){}
    await new Promise(resolve=>{
      const tick=()=>{
        if(cancelled||v.currentTime>=s.end-0.02||v.ended){ v.pause(); resolve(); return; }
        setProgress((doneLen+Math.max(0,v.currentTime-s.start))/totalLen);
        setTimeout(tick,30);
      };
      tick();
    });
    doneLen+=segLen(s);
  }
  drawing=false;
  await new Promise(r=>{ rec.onstop=r; rec.stop(); });
  stream.getVideoTracks().forEach(tr=>tr.stop());
  rate=savedRate;
  exporting=null;
  if(cancelled){ hideModal(); await seekGlobal(0); return; }

  const type=rec.mimeType||mime||"video/webm";
  const ext=type.includes("mp4")?"mp4":"webm";
  const blob=new Blob(chunks,{type});
  const name=`45cutjoin_${new Date().toISOString().slice(0,19).replace(/[-:T]/g,"")}.${ext}`;
  const file=new File([blob],name,{type});
  const btns=[];
  if(navigator.canShare && navigator.canShare({files:[file]})){
    btns.push({label:t("share"),pri:true,fn:async()=>{ try{ await navigator.share({files:[file]}); }catch(e){} }});
  }
  btns.push({label:t("close")});
  download(blob,name);
  showModal(t("saved"),t("savedText"),btns);
  await seekGlobal(0);
}
function download(blob,name){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},60000);
}

function setProgress(p){ $("#mFill").style.width=Math.round(Math.min(1,p)*100)+"%"; }
function toast(msg){ const c=$("#centerIcon"); c.classList.add("msg"); c.textContent=msg; c.classList.add("show"); clearTimeout(c._t); c._t=setTimeout(()=>c.classList.remove("show"),1600); }
