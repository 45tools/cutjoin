<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="45 Cut&amp;Join">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>45 Cut &amp; Join</title>
<style>
:root{
  --bg:#111418; --panel:#1b1f25; --panel2:#252a32; --line:#323844;
  --text:#eef1f5; --sub:#9aa3af; --accent:#ff6a3d; --accent2:#3da5ff; --ok:#3ddc97; --danger:#ff4d5e; --star:#ffc94d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,select,a,summary,label{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","PingFang TC","PingFang SC",sans-serif;}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:8px;padding:10px 14px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
header h1 small{color:var(--sub);font-weight:500;font-size:11px;margin-left:6px}
header .sp{flex:1}
select,button{font:inherit;color:inherit}
.hbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap}
header h1{white-space:nowrap}
@media (max-width:420px){header h1 small{display:none}}
.wrap{max-width:900px;margin:0 auto;padding:0 12px calc(96px + env(safe-area-inset-bottom))}

/* プレーヤー */
#stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;touch-action:pan-y}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;visibility:hidden;pointer-events:none}
#stage video.on{visibility:visible}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--sub);text-align:center;padding:16px}
#empty .big{font-size:15px;color:var(--text)}
#empty .pick{font-size:17px;padding:14px 26px;border-radius:14px}
.linkbtn{background:none;border:none;color:var(--accent2);font-size:13px;text-decoration:underline;padding:4px}
.ripple{position:absolute;top:0;bottom:0;width:40%;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}
.ripple.l{left:0;border-radius:0 50% 50% 0;background:radial-gradient(circle at 30% 50%,rgba(255,255,255,.18),transparent 70%)}
.ripple.r{right:0;border-radius:50% 0 0 50%;background:radial-gradient(circle at 70% 50%,rgba(255,255,255,.18),transparent 70%)}
.ripple.show{opacity:1}
.ripple span{background:rgba(0,0,0,.55);padding:8px 14px;border-radius:20px;font-weight:700;font-size:15px}
#centerIcon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:64px;height:64px;border-radius:32px;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:26px;opacity:0;transition:opacity .3s;pointer-events:none;padding:0 16px;white-space:nowrap}
#centerIcon.msg{font-size:14px}
#centerIcon.show{opacity:1}
#timeBadge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:8px;font-variant-numeric:tabular-nums;font-size:13px;pointer-events:none}
#segBadge{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:8px;font-size:12px;pointer-events:none}

/* 再生操作 */
.transport{display:flex;align-items:center;gap:10px;margin-top:10px}
.time{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.time b{font-weight:700}
.time .tot{color:var(--sub)}
.round{width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.round.sec{background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:700}
.round:disabled{opacity:.35}
.transport .sp{flex:1}

/* タイムライン */
#timeline{position:relative;height:64px;margin-top:12px;background:var(--panel);border-radius:10px;overflow:hidden;touch-action:none}
.seg{position:absolute;top:8px;bottom:8px;border-radius:6px;overflow:hidden;display:flex;align-items:flex-end;padding:3px 5px;font-size:10px;color:rgba(255,255,255,.9);border:2px solid transparent;background-size:cover;background-position:center}
.seg.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.seg .lbl{background:rgba(0,0,0,.55);border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.8);pointer-events:none;z-index:3}
#playhead::before{content:"";position:absolute;top:-1px;left:-6px;border:7px solid transparent;border-top-color:#fff}
#range{position:absolute;top:0;bottom:0;background:rgba(255,77,94,.28);border-left:2px solid var(--star);border-right:2px solid var(--star);pointer-events:none;display:none;z-index:1}
#range.on{display:block}
#range.noL{border-left:none}#range.noR{border-right:none}
.mk{position:absolute;top:0;bottom:0;width:2px;background:var(--star);z-index:2;pointer-events:none}
.mk::after{content:"★";position:absolute;top:-2px;left:-5px;font-size:11px;color:var(--star);text-shadow:0 0 2px #000}
.tlhint{color:var(--sub);font-size:11px;margin:6px 2px 0;text-align:center}

/* ★印のチップ */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid #5a4a1c;color:var(--star);border-radius:16px;padding:4px 4px 4px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.chip button{background:none;border:none;color:var(--sub);font-size:14px;padding:0 6px}

/* 主な操作（大きく3つ） */
.main3{display:grid;grid-template-columns:1.25fr 1fr .8fr;gap:8px;margin-top:12px}
.act{border:none;border-radius:14px;padding:14px 6px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);color:var(--text)}
.act.cut{background:var(--accent);color:#fff}
.act.star{background:var(--star);color:#1b1f25}
.act:disabled{opacity:.35}
.act:active:not(:disabled){transform:scale(.97)}

/* 選択中のクリップ */
.selbox{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.selhead{display:flex;align-items:center;gap:8px;font-size:14px}
.selhead .dot{width:12px;height:12px;border-radius:3px;flex:none}
.selhead .info{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums;margin-left:auto;text-align:right}
.selbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.sbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.sbtn .ic{font-size:18px;line-height:1}
.sbtn.del{color:#ff8a94;border-color:#5a2a30}
.sbtn:disabled{opacity:.35}
.selnone{color:var(--sub);font-size:13px;line-height:1.6}

/* その他の機能 */
details.more{margin-top:12px;background:var(--panel);border-radius:14px;padding:0 12px}
details.more summary{padding:13px 2px;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"＋";margin-left:auto;color:var(--sub)}
details.more[open] summary::after{content:"－"}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sbtn.on{border-color:var(--accent2);color:var(--accent2)}
.sbtn.setp{border-color:var(--star);color:var(--star)}
.subt{color:var(--sub);font-size:12px;margin:14px 2px 8px}
.morepad{height:12px}

.foot{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.support{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:20px;padding:8px 18px;font-size:13px;text-decoration:none}
.brand{color:var(--sub);font-size:11px;text-align:center;margin-top:10px}

/* 下部の保存ボタン */
.savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:20}
.savebar button{display:block;width:100%;max-width:876px;margin:0 auto;border:none;border-radius:16px;padding:15px;font-size:17px;font-weight:800;background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.savebar button:disabled{background:var(--panel2);color:var(--sub);box-shadow:none}

/* シート・ダイアログ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:40}
.overlay.show{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:18px}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.opt b{display:block;font-size:15px}
.opt span{display:block;color:var(--sub);font-size:12px;margin-top:3px}
.opt b span{display:inline;color:inherit;font-size:inherit;margin:0}
.opt.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.pri span{color:rgba(255,255,255,.85)}
.opt:disabled{opacity:.4}
.hlrow{display:flex;gap:6px;margin:-2px 0 10px}
.hlrow select{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-size:13px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin:8px 2px 14px}
.chk input{width:22px;height:22px}
.closeb{display:block;width:100%;background:none;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:14px;color:var(--sub)}
.help{line-height:1.7;font-size:14px}
.help h3{font-size:14px;margin:16px 0 4px;color:var(--accent)}
.help ol,.help ul{margin:0;padding-left:20px}
.help li{margin:3px 0}
.help .note{background:var(--panel2);border-radius:10px;padding:10px 12px;color:var(--sub);font-size:13px;margin-top:6px}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.show{display:flex}
.card{background:var(--panel);border-radius:16px;padding:20px;max-width:420px;width:100%}
.card h2{margin:0 0 10px;font-size:17px}
.card p{color:var(--sub);font-size:13px;line-height:1.6;margin:8px 0;white-space:pre-line}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.row{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btn{border:none;border-radius:12px;padding:12px 16px;background:var(--panel2);font-size:15px}
.btn.pri{background:var(--accent);color:#fff;font-weight:700}
#exportCanvas{display:none}
:fullscreen #stage, #stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
</style>
</head>
<body>
<header>
  <h1>45 Cut &amp; Join<small>by 45tools</small></h1>
  <div class="sp"></div>
  <button class="hbtn" id="helpBtn" aria-label="help">？ <span data-i="helpShort"></span></button>
  <select id="lang" class="hbtn" aria-label="Language">
    <option value="ja">日本語</option><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh">简体中文</option>
  </select>
</header>

<div class="wrap">
  <div id="stage">
    <div id="empty">
      <div class="big" data-i="emptyTitle"></div>
      <button class="btn pri pick" id="addFirst" data-i="addVideo"></button>
      <div data-i="emptySub" style="font-size:12px"></div>
      <button class="linkbtn" id="slowBtn" data-i="slowLink"></button>
    </div>
    <div class="ripple l" id="rl"><span>« 10s</span></div>
    <div class="ripple r" id="rr"><span>10s »</span></div>
    <div id="centerIcon">▶</div>
    <div id="timeBadge" hidden></div>
    <div id="segBadge" hidden></div>
  </div>

  <div class="transport">
    <button class="round sec" id="back10" aria-label="-10s">−10</button>
    <button class="round" id="play" aria-label="play">▶</button>
    <button class="round sec" id="fwd10" aria-label="+10s">+10</button>
    <div class="sp"></div>
    <div class="time"><b id="cur">0:00</b> <span class="tot">/ <span id="tot">0:00</span></span></div>
    <button class="round sec" id="speed" style="font-size:12px">1x</button>
    <button class="round sec" id="fs" aria-label="fullscreen">⛶</button>
  </div>

  <div id="timeline"><div id="range"></div><div id="playhead" style="left:0"></div></div>
  <p class="tlhint" id="tlHint" data-i="tlHint"></p>
  <div class="chips" id="markChips"></div>

  <div class="main3">
    <button class="act cut" id="splitBtn">✂︎ <span data-i="cutHere"></span></button>
    <button class="act star" id="markBtn">★ <span data-i="markOn"></span></button>
    <button class="act" id="undoBtn">↶ <span data-i="undo"></span></button>
  </div>

  <div class="selbox" id="selBox">
    <div id="selNone" class="selnone" data-i="selNone"></div>
    <div id="selOn" hidden>
      <div class="selhead"><span class="dot" id="selDot"></span><b id="selTitle"></b><span class="info" id="selInfo"></span></div>
      <div class="selbtns">
        <button class="sbtn del" id="delBtn"><span class="ic">🗑</span><span data-i="del"></span></button>
        <button class="sbtn" id="leftBtn"><span class="ic">◀</span><span data-i="moveL"></span></button>
        <button class="sbtn" id="rightBtn"><span class="ic">▶</span><span data-i="moveR"></span></button>
        <button class="sbtn" id="saveOneBtn"><span class="ic">⤓</span><span data-i="saveThis"></span></button>
      </div>
    </div>
  </div>

  <details class="more" id="more">
    <summary data-i="more"></summary>
    <div class="grid4">
      <button class="sbtn" id="addBtn"><span class="ic">＋</span><span data-i="addMore"></span></button>
      <button class="sbtn" id="sortBtn"><span class="ic">🕒</span><span data-i="sortDate"></span></button>
      <button class="sbtn" id="snapBtn"><span class="ic">📷</span><span data-i="snap"></span></button>
      <button class="sbtn" id="muteBtn"><span class="ic" id="muteIc">🔊</span><span id="muteLbl"></span></button>
    </div>
    <p class="subt" data-i="rangeHelp"></p>
    <div class="grid3">
      <button class="sbtn" id="inBtn"><span class="ic">⟦</span><span data-i="inPt"></span></button>
      <button class="sbtn" id="outBtn"><span class="ic">⟧</span><span data-i="outPt"></span></button>
      <button class="sbtn del" id="rangeDelBtn"><span class="ic">⌫</span><span data-i="rangeDel"></span></button>
    </div>
    <div class="morepad"></div>
  </details>

  <div class="foot">
    <a class="support" id="supportLink" target="_blank" rel="noopener" data-i="support"></a>
  </div>
  <div class="brand">© 45tools</div>
</div>

<div class="savebar"><button id="exportBtn">⤓ <span data-i="saveBtn"></span></button></div>

<!-- 保存のしかた -->
<div class="overlay" id="saveSheet"><div class="sheet">
  <h2 data-i="saveTitle"></h2>
  <button class="opt pri" id="joinBtn"><b data-i="saveJoin"></b><span data-i="saveJoinD"></span></button>
  <button class="opt" id="partsBtn"><b data-i="saveEach"></b><span data-i="saveEachD"></span></button>
  <button class="opt" id="hlBtn"><b>★ <span data-i="saveHl"></span></b><span id="hlDesc"></span></button>
  <div class="hlrow"><select id="preSel" aria-label="before"></select><select id="postSel" aria-label="after"></select></div>
  <label class="chk"><input type="checkbox" id="muteChk"><span data-i="muteSave"></span></label>
  <button class="closeb" data-close data-i="close"></button>
</div></div>

<!-- 使い方 -->
<div class="overlay" id="helpSheet"><div class="sheet">
  <h2 data-i="helpTitle"></h2>
  <div class="help" id="helpBody"></div>
  <div style="height:14px"></div>
  <button class="closeb" data-close data-i="close"></button>
</div></div>

<input type="file" id="file" accept="video/*" multiple hidden>
<canvas id="exportCanvas"></canvas>

<div id="modal"><div class="card">
  <h2 id="mTitle"></h2>
  <p id="mText"></p>
  <div class="bar" id="mBar"><i id="mFill"></i></div>
  <div class="row" id="mRow"></div>
</div></div>

<script src="mp4cut.js"></script>
<script>
/* ===== 設定 ===== */
const SUPPORT_URL = "https://ofuse.me/45tools"; // ← OFUSEのURLに差し替え
const SKIP = 10;

/* ===== 多言語 ===== */
const I18N = {

 zh:{helpShort:"说明",helpTitle:"使用说明",help:"<h3>基本3步</h3><ol><li>点“选择视频”（选多个会按选择顺序拼接）。</li><li>边播放边在不需要的场面<b>开头</b>点“✂ 在此剪开”，<b>结尾</b>再点一次。点时间轴上中间的片段，再点“🗑 删除”。</li><li>点下方“⤓ 保存”→ 选择保存方式 →“存到照片”→ 在下一个画面选“存储视频”。</li></ol><h3>画面操作</h3><ul><li>点画面中央：播放／暂停</li><li>双击画面右侧／左侧：快进／快退10秒（连续点为20秒、30秒…）</li><li>在时间轴上滑动：跳到任意位置</li></ul><h3>用★标记做精彩片段</h3><ul><li>在进球等场面点“★ 做标记”。保存时选“只保存★标记前后”，即可得到只含这些场面的视频。</li></ul><h3>加快读取</h3><div class=\"note\">从照片图库选择时，iPhone会先转换视频再交给浏览器，视频越长越慢（7分钟约1分钟）。<br>先在照片App选中视频→“分享”→“存储到‘文件’”，再在本应用“选择视频”→“选取文件”选它，就不会转换，以原画质立即读取。</div><h3>小提示</h3><ul><li>剪开位置会对齐到最近的关键帧（通常误差1秒以内）。</li><li>保存不重新编码，瞬间完成，画质与读取的视频相同。</li></ul>",slowLink:"读取太慢？",slowTitle:"加快读取",slowText:"从照片图库选择时，iPhone会先转换视频再交给浏览器，视频越长越慢（7分钟约1分钟）。\n\n加快方法：\n① 在照片App选中视频→“分享”→“存储到‘文件’”\n② 在本应用“选择视频”→“选取文件”选它\n\n不会转换，立即读取，画质不变。",tlHint:"在时间轴上滑动可移动，点片段可选中",cutHere:"在此剪开",markOn:"做标记",selNone:"用“✂ 在此剪开”分开后，点时间轴上的片段即可删除、调整顺序或单独保存。",moveL:"往前",moveR:"往后",saveThis:"只存这段",more:"更多功能",addMore:"添加视频",rangeHelp:"一次删除休息等长段：在播放位置设“起点”“终点”，再点“删除范围”",inPt:"设为起点",outPt:"设为终点",rangeDel:"删除范围",saveBtn:"保存",saveTitle:"保存方式",saveJoin:"合并为一个视频",saveJoinD:"按当前顺序把所有片段合成一个视频",saveEach:"每个片段分别保存",saveEachD:"把剪开的片段存为单独的视频",saveHl:"只保存★标记前后",hlDesc:"把{n}处★标记前后的场面连成一个视频",hlDescNone:"还没有★标记（播放时点“★ 做标记”）",muteSave:"保存为无声视频",fastTitle:"已准备好保存",fastText:"画质保持原样（不重新编码）。\n点“存到照片”，在下一个画面选“存储视频”即可存入照片App。",savePhotos:"存到照片",saveFiles:"存到文件",snapText:"已将当前画面存为图片。\n“存到照片”→ 下一个画面选“存储图像”。",shareFail:"无法打开分享画面。请“存到文件”，再在文件App中打开→分享→“存储视频”。",noShare:"此设备无法直接存入照片App。请“存到文件”，再在文件App中打开→分享→“存储视频”。",emptySub:"选多个会按选择顺序拼接",emptyTitle:"请选择用手机拍摄的视频",loading:"加载中…",playErr:"无法开始播放",addVideo:"选择视频",

/* ===== 状態 ===== */
const $ = s => document.querySelector(s);
const stage=$("#stage"), timeline=$("#timeline"), playhead=$("#playhead");
const COLORS=["#ff6a3d","#3da5ff","#3ddc97","#c77dff","#ffc94d","#ff5fa2","#4dd9e8","#a3e05b"];
let sources=[];   // {id,name,url,duration,video,color,thumb,w,h}
let segs=[];      // {id,src,start,end}
let cur=0;        // 現在のセグメントindex
let selected=-1;
let playing=false;
let rate=1;
let history=[];
let uid=1;
let exporting=null;
let rangeIn=null, rangeOut=null, muted=false;

const segLen = s => Math.max(0,s.end-s.start);
const total = () => segs.reduce((a,s)=>a+segLen(s),0);
const offsetOf = i => segs.slice(0,i).reduce((a,s)=>a+segLen(s),0);
const srcOf = s => sources.find(x=>x.id===s.src);
function fmt(sec){
  sec=Math.max(0,(sec||0)+0.05);
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=Math.floor(sec%60);
  return h? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;
}
function snapshot(){ history.push(JSON.stringify({segs,cur,selected})); if(history.length>50) history.shift(); }

/* ===== 読み込み ===== */
$("#addFirst").onclick=$("#addBtn").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
  const files=[...e.target.files]; e.target.value="";
  if(!files.length) return;
  snapshot(); clearRange();
  const wasEmpty=!segs.length;
  let done=0; const show=()=>{ $("#empty .big").textContent=`${t("loading")} ${done}/${files.length}`; }; show();
  const results=await Promise.allSettled(files.map(f=>loadSource(f).finally(()=>{ done++; show(); })));
  results.forEach((r,i)=>{
    if(r.status==="fulfilled") segs.push({id:uid++,src:r.value.id,start:0,end:r.value.duration});
    else alert(t("errLoad")+files[i].name+"\n("+(r.reason&&r.reason.message||"")+")");
  });
  $("#empty .big").textContent=t("emptyTitle");
  if(wasEmpty && segs.length){ cur=0; selected=0; await activate(0,segs[0].start); }
  refresh();
};
// iPhone対策：動画要素を先に画面へ置いてから読み込む。
// メタデータが来なくても、MP4/MOVなら自前の解析結果（長さ）で先に進む。
async function loadSource(file){
  let mp4=null; try{ mp4=await MP4Cut.parse(file); }catch(e){ mp4=null; }
  const v=document.createElement("video");
  v.playsInline=true; v.muted=muted; v.preload="auto";
  v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline","");
  stage.insertBefore(v,$("#rl"));
  const url=URL.createObjectURL(file);
  v.src=url; try{ v.load(); }catch(e){}
  const meta=await new Promise(res=>{
    let done=false; const fin=x=>{ if(!done){ done=true; res(x); } };
    v.addEventListener("loadedmetadata",()=>fin("ok"),{once:true});
    v.addEventListener("error",()=>fin("error"),{once:true});
    setTimeout(()=>fin("timeout"),mp4?300:6000); // MP4/MOVは自前の解析で長さが分かるので待たない
  });
  let dur=(meta==="ok"&&isFinite(v.duration)&&v.duration>0)?v.duration:NaN;
  if(!isFinite(dur)&&mp4&&meta!=="error") dur=mp4.duration;
  if(!isFinite(dur)||dur<=0){
    const code=v.error?(" code "+v.error.code):"";
    v.remove(); URL.revokeObjectURL(url);
    throw new Error(meta+code);
  }
  const created=(mp4&&mp4.created)||null;
  const src={id:uid++,name:file.name,file,mp4,url,duration:dur,video:v,color:COLORS[sources.length%COLORS.length],w:v.videoWidth,h:v.videoHeight,thumb:null,created};
  if(!src.w) v.addEventListener("loadedmetadata",()=>{ src.w=v.videoWidth; src.h=v.videoHeight; },{once:true});
  src.key=file.size+"|"+dur.toFixed(1);
  const saved=mkAll()[src.key]; src.markers=saved?saved.t.slice():[];
  sources.push(src);
  v.addEventListener("timeupdate",()=>onTime(src));
  v.addEventListener("ended",()=>onEnded(src));
  makeThumb(src);
  return src;
}
function makeThumb(src){
  // 本体の動画に最初の映像が届いたら、そのコマをタイムライン用に縮小して使う（2本目の動画は開かない）
  const v=src.video;
  const grab=()=>{
    try{
      if(!v.videoWidth) return;
      const c=document.createElement("canvas"); const w=160, h=Math.round(160*(v.videoHeight/v.videoWidth||9/16));
      c.width=w; c.height=h; c.getContext("2d").drawImage(v,0,0,w,h);
      src.thumb=c.toDataURL("image/jpeg",.6); src.w=v.videoWidth; src.h=v.videoHeight; renderTimeline();
    }catch(e){}
  };
  if(v.readyState>=2) grab(); else v.addEventListener("loadeddata",grab,{once:true});
}

/* ===== 再生制御 ===== */
function activeVideo(){ const s=segs[cur]; return s? srcOf(s).video : null; }
async function activate(i,time){
  const s=segs[i]; if(!s) return;
  const prev=activeVideo();
  cur=i;
  const v=srcOf(s).video;
  if(prev && prev!==v){ prev.pause(); prev.classList.remove("on"); }
  v.classList.add("on");
  v.playbackRate=rate;
  if(Math.abs(v.currentTime-time)>0.05) await seekVideo(v,time);
  if(playing){ try{ await v.play(); }catch(e){ playing=false; } }
  updateUI();
}
function seekVideo(v,time){
  return new Promise(r=>{
    let done=false; const fin=()=>{ if(!done){done=true; r();} };
    v.addEventListener("seeked",fin,{once:true}); setTimeout(fin,800);
    v.currentTime=time;
  });
}
function onTime(src){
  const s=segs[cur]; if(!s||s.src!==src.id) return;
  if(src.video.currentTime>=s.end-0.03 && playing) advance();
  updateUI();
}
function onEnded(src){ const s=segs[cur]; if(s&&s.src===src.id&&playing) advance(); }
let advancing=false;
async function advance(){
  if(advancing) return; advancing=true;
  if(cur<segs.length-1){ await activate(cur+1,segs[cur+1].start); }
  else { setPlaying(false); const v=activeVideo(); if(v) v.pause(); }
  advancing=false;
}
function globalTime(){
  const s=segs[cur]; if(!s) return 0;
  const v=srcOf(s).video;
  return offsetOf(cur)+Math.min(segLen(s),Math.max(0,v.currentTime-s.start));
}
async function seekGlobal(g){
  if(!segs.length) return;
  g=Math.max(0,Math.min(total()-0.05,g));
  let acc=0;
  for(let i=0;i<segs.length;i++){
    const L=segLen(segs[i]);
    if(g<acc+L || i===segs.length-1){ await activate(i,segs[i].start+Math.min(L,g-acc)); break; }
    acc+=L;
  }
  updateUI();
}
function setPlaying(p){
  playing=p; $("#play").textContent=p?"❚❚":"▶";
}
// iPhoneは「タップの処理の中で」始めた再生しか許さないため、待ち処理を挟まずに play() を呼ぶ
function togglePlay(){
  if(!segs.length) return;
  const v=activeVideo();
  if(playing){ setPlaying(false); v.pause(); flashCenter("❚❚"); return; }
  if(globalTime()>=total()-0.1){ // 最後まで再生済みなら先頭へ（同期的に切り替え）
    const s0=segs[0], v0=srcOf(s0).video;
    if(v!==v0){ v.pause(); v.classList.remove("on"); }
    cur=0; v0.classList.add("on"); try{ v0.currentTime=s0.start; }catch(e){}
  }
  startPlay();
}
function startPlay(){
  const v=activeVideo(); if(!v) return;
  setPlaying(true); v.playbackRate=rate; v._unlocked=true;
  const p=v.play();
  if(p&&p.catch) p.catch(e=>{ if(activeVideo()===v){ setPlaying(false); toast(t("playErr")+" ("+e.name+")"); } });
  unlockOthers(v);
  flashCenter("▶");
}
// 2本目以降の動画も、最初のタップのときに再生許可を得ておく（クリップをまたいだ自動再生のため）
function unlockOthers(except){
  sources.forEach(x=>{
    const o=x.video; if(o===except||o._unlocked) return;
    o._unlocked=true; const m=o.muted; o.muted=true;
    try{ const q=o.play(); if(q&&q.then) q.then(()=>{ if(o!==activeVideo()||!playing) o.pause(); o.muted=m; }).catch(()=>{ o.muted=m; o._unlocked=false; }); }catch(e){ o.muted=m; }
  });
}
fastTap($("#play"),togglePlay);
fastTap($("#back10"),()=>skip(-SKIP));
fastTap($("#fwd10"),()=>skip(SKIP));
function skip(d){ if(!segs.length) return; seekGlobal(globalTime()+d); ripple(d>0?"r":"l"); }
$("#speed").onclick=()=>{
  const list=[1,1.5,2,0.5]; rate=list[(list.indexOf(rate)+1)%list.length];
  $("#speed").textContent=rate+"x"; const v=activeVideo(); if(v) v.playbackRate=rate;
};
$("#fs").onclick=()=>{
  const v=activeVideo();
  if(stage.requestFullscreen) { document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen().catch(()=>{}); }
  else if(v && v.webkitEnterFullscreen) v.webkitEnterFullscreen(); // iPhone
};

/* ダブルタップ判定（YouTube風） */
let lastTap={t:0,x:0,side:null}, tapTimer=null, chain=0;
function stageTap(clientX){
  if(!segs.length||exporting) return;
  const r=stage.getBoundingClientRect(); const x=clientX-r.left;
  const side = x<r.width*0.4?"l": x>r.width*0.6?"r":"c";
  const now=performance.now();
  if(now-lastTap.t<350 && side===lastTap.side && side!=="c"){
    chain++; skip(side==="r"?SKIP:-SKIP);
    showRippleCount(side,chain);
    lastTap={t:now,side};
    return;
  }
  chain=0;
  lastTap={t:now,side};
  if(side==="c") togglePlay();   // 待たずに実行（iPhoneの再生許可のため）
}
// タッチは touchend で処理して既定動作（ダブルタップ拡大）を止める。マウスは pointerup。
let touchStart=null;
stage.addEventListener("touchstart",e=>{ const p=e.changedTouches[0]; touchStart={x:p.clientX,y:p.clientY}; },{passive:true});
stage.addEventListener("touchend",e=>{
  if(e.target.closest("#empty")) return;   // 「動画を選ぶ」ボタンなどは通常どおり
  e.preventDefault();
  const p=e.changedTouches[0];
  if(touchStart&&Math.hypot(p.clientX-touchStart.x,p.clientY-touchStart.y)>12) return; // なぞっただけ
  stageTap(p.clientX);
},{passive:false});
stage.addEventListener("pointerup",e=>{ if(e.pointerType!=="touch"&&!e.target.closest("#empty")) stageTap(e.clientX); });
// 連打するボタンも touchend で即実行（拡大させない・取りこぼさない）
function fastTap(el,fn){
  el.addEventListener("touchend",e=>{ e.preventDefault(); if(!el.disabled) fn(); },{passive:false});
  el.addEventListener("click",()=>{ if(!el.disabled) fn(); });   // タッチ時は touchend で既定動作を止めているので click は来ない
}
stage.addEventListener("dblclick",e=>e.preventDefault());
function ripple(side){
  const el=$(side==="r"?"#rr":"#rl"); el.classList.add("show");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),500);
}
function showRippleCount(side,n){
  const el=$(side==="r"?"#rr":"#rl");
  el.querySelector("span").textContent= side==="r"? `${(n)*SKIP}s »` : `« ${(n)*SKIP}s`;
  clearTimeout(el._c); el._c=setTimeout(()=>{ el.querySelector("span").textContent= side==="r"?"10s »":"« 10s"; },700);
}
function flashCenter(txt){
  const c=$("#centerIcon"); c.classList.remove("msg"); c.textContent=txt; c.classList.add("show");
  clearTimeout(c._t); c._t=setTimeout(()=>c.classList.remove("show"),450);
}

/* ===== タイムライン ===== */
function renderTimeline(){
  timeline.querySelectorAll(".seg").forEach(n=>n.remove());
  const T=total(); if(!T) return;
  const W=timeline.clientWidth-8; let acc=0;
  segs.forEach((s,i)=>{
    const src=srcOf(s); const d=document.createElement("div");
    d.className="seg"+(i===selected?" sel":"");
    d.style.left=(4+acc/T*W)+"px"; d.style.width=Math.max(4,segLen(s)/T*W-2)+"px";
    d.style.backgroundColor=src.color;
    if(src.thumb) d.style.backgroundImage=`linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.35)),url(${src.thumb})`;
    d.innerHTML=`<span class="lbl">${i+1}</span>`;
    d.dataset.i=i;
    timeline.insertBefore(d,playhead);
    acc+=segLen(s);
  });
}
let dragging=false, downPos=null;
timeline.addEventListener("pointerdown",e=>{ if(!segs.length) return; dragging=true; downPos={x:e.clientX}; timeline.setPointerCapture(e.pointerId); scrub(e); });
timeline.addEventListener("pointermove",e=>{ if(dragging) scrub(e); });
timeline.addEventListener("pointerup",e=>{
  if(!dragging) return; dragging=false;
  if(Math.abs(e.clientX-downPos.x)<6){ // タップ＝選択
    const i=segIndexAtX(e.clientX); if(i>=0){ selected=i; renderTimeline(); renderList(); }
  }
});
function xToGlobal(clientX){
  const r=timeline.getBoundingClientRect(); const W=r.width-8;
  return Math.max(0,Math.min(1,(clientX-r.left-4)/W))*total();
}
function segIndexAtX(clientX){
  const g=xToGlobal(clientX); let acc=0;
  for(let i=0;i<segs.length;i++){ acc+=segLen(segs[i]); if(g<=acc) return i; } return segs.length-1;
}
let scrubPending=null, scrubBusy=false;
async function scrub(e){
  scrubPending=xToGlobal(e.clientX);
  movePlayhead(scrubPending);
  if(scrubBusy) return; scrubBusy=true;
  while(scrubPending!==null){ const g=scrubPending; scrubPending=null; await seekGlobal(g); }
  scrubBusy=false;
}
function movePlayhead(g){
  const T=total(); const W=timeline.clientWidth-8;
  playhead.style.left=(T? 4+g/T*W : 4)+"px";
}

/* ===== 編集 ===== */
// 全体時刻 g の位置で切る（キーフレームに合わせる）。切れ目のセグメント番号を返す
function splitAtGlobal(g){
  let acc=0;
  for(let i=0;i<segs.length;i++){
    const s=segs[i], L=segLen(s);
    if(g<=acc+L+1e-6){
      const src=srcOf(s); let at=s.start+(g-acc);
      if(src.mp4) at=MP4Cut.snap(src.mp4,at);
      if(at-s.start<0.3) return i;
      if(s.end-at<0.3) return i+1;
      segs.splice(i,1,{id:uid++,src:s.src,start:s.start,end:at},{id:uid++,src:s.src,start:at,end:s.end});
      if(cur>i) cur++;
      return i+1;
    }
    acc+=L;
  }
  return segs.length;
}

const MK_KEY="cj_markers";
function mkAll(){ try{ return JSON.parse(localStorage.getItem(MK_KEY)||"{}"); }catch(e){ return {}; } }
function mkStore(){
  const all=mkAll();
  sources.forEach(x=>{ if(x.markers.length) all[x.key]={t:x.markers,u:Date.now()}; else delete all[x.key]; });
  const keys=Object.keys(all).sort((a,b)=>all[b].u-all[a].u); keys.slice(300).forEach(k=>delete all[k]); // 古いものだけ整理
  try{ localStorage.setItem(MK_KEY,JSON.stringify(all)); }catch(e){}
}
function visibleMarks(){
  const out=[]; let acc=0;
  segs.forEach((s,i)=>{ const src=srcOf(s);
    for(const t of src.markers) if(t>=s.start-0.01&&t<s.end) out.push({g:acc+(t-s.start),t,src,seg:i});
    acc+=segLen(s); });
  return out;
}
function renderMarks(){

// マーカー前後の範囲（全体時刻）→ 元動画上のパーツ
function highlightParts(){
  const pre=+$("#preSel").value, post=+$("#postSel").value, T=total();
  const rs=[]; visibleMarks().forEach(m=>{ const a=Math.max(0,m.g-pre), b=Math.min(T,m.g+post);
    if(rs.length&&a<=rs[rs.length-1][1]) rs[rs.length-1][1]=Math.max(rs[rs.length-1][1],b); else rs.push([a,b]); });
  const parts=[]; let acc=0;
  segs.forEach(s=>{ const Ls=segLen(s), src=srcOf(s);
    for(const [a0,b0] of rs){ const a=Math.max(a0,acc), b=Math.min(b0,acc+Ls); if(b-a<0.2) continue;
      let st=s.start+(a-acc), en=s.start+(b-acc);
      if(src.mp4){ st=Math.max(s.start,MP4Cut.snap(src.mp4,st)); if(en<s.end-0.05) en=Math.min(s.end,MP4Cut.snap(src.mp4,en)); }
      if(en-st>=0.3) parts.push({id:uid++,src:s.src,start:st,end:en}); }
    acc+=Ls; });
  return {parts,count:rs.length};
}

let audioCtx=null, audioDest=null;
function ensureAudio(){
  if(audioCtx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  audioCtx=new AC(); audioDest=audioCtx.createMediaStreamDestination();
  sources.forEach(hookAudio);
}
function hookAudio(src){
  if(src.audioNode||!audioCtx) return;
  try{
    src.audioNode=audioCtx.createMediaElementSource(src.video);
    src.audioNode.connect(audioCtx.destination);
    src.audioNode.connect(audioDest);
  }catch(e){}
}
function pickMime(){
  const c=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  if(!window.MediaRecorder) return null;
  for(const m of c){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return "";
}

function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
const L=x=>typeof x==="number"?segs[x]:x;
function fastable(indices){
  const ms=[...new Set(indices.map(i=>srcOf(L(i)).mp4))];
  if(ms.some(m=>!m)) return "noparse";
  return MP4Cut.compatible(ms) ? "ok" : "mixed";
}
function buildFile(indices,name){
  const parts=indices.map(i=>{ const s=L(i); return {m:srcOf(s).mp4,start:s.start,end:s.end}; });
  const r=MP4Cut.build(parts,{mute:muted});
  return new File([r.blob],`${name}.${r.ext}`,{type:r.mime});
}
function saveJoined(indices,tag){
  if(!indices.length) return;
  if(playing){ setPlaying(false); activeVideo().pause(); }
  const ok=fastable(indices);
  if(ok!=="ok"){ askCompat(ok,()=>doExport(indices)); return; }
  try{ showResult([buildFile(indices,"45cutjoin_"+(tag?tag+"_":"")+stamp())]); }
  catch(e){ askCompat("noparse",()=>doExport(indices)); }
}
function saveParts(indices,tag){
  if(!indices.length) return;
  if(playing){ setPlaying(false); activeVideo().pause(); }
  const bad=indices.filter(i=>fastable([i])!=="ok");
  if(bad.length){ askCompat("noparse",()=>doExport(bad)); return; }
  const st=stamp();
  showResult(indices.map((i,k)=>buildFile([i],`45cutjoin_${tag?tag+"_":""}${st}_${String(k+1).padStart(2,"0")}`)));
}
function askCompat(kind,go){
  showModal(t("compatTitle"),kind==="mixed"?t("compatText"):t("parseFail"),[{label:t("cancel")},{label:t("compatGo"),pri:true,fn:()=>setTimeout(go,0)}]);
}
// 共有できる形を探す（iPhoneは種類の判定が厳しいので、別の種類名でも試す）
function shareable(files){
  if(!navigator.share||!navigator.canShare) return null;
  const tries=[files,
    files.map(f=>f.type.startsWith("video/")?new File([f],f.name.replace(/\.\w+$/,".mp4"),{type:"video/mp4"}):f),
    files.map(f=>f.type.startsWith("video/")?new File([f],f.name.replace(/\.\w+$/,".mov"),{type:"video/quicktime"}):f)];
  for(const fs of tries){ try{ if(navigator.canShare({files:fs})) return fs; }catch(e){} }
  return null;
}
function showResult(files,kind){
  const btns=[], sh=shareable(files);
  if(sh) btns.push({label:"📷 "+t("savePhotos"),pri:true,keep:true,fn:()=>{
    navigator.share({files:sh}).catch(e=>{ if(e&&e.name!=="AbortError") showModal(t("fastTitle"),t("shareFail"),[{label:t("saveFiles"),fn:()=>files.forEach((f,i)=>setTimeout(()=>download(f,f.name),i*700))},{label:t("close")}]); });
  }});
  btns.push({label:"📁 "+t("saveFiles"),pri:!sh,keep:true,fn:()=>files.forEach((f,i)=>setTimeout(()=>download(f,f.name),i*700))});
  btns.push({label:t("close")});
  const sz=files.reduce((a,f)=>a+f.size,0)/1048576;
  const head=`${files.length>1?files.length+" files · ":""}${sz.toFixed(1)} MB${kind!=="snap"&&muted?t("mutedNote"):""}\n`;
  const body=kind==="snap"?t("snapText"):t("fastText");
  showModal(kind==="snap"?t("snapTitle"):t("fastTitle"),head+(sh?body:t("noShare")),btns);
}

async function doExport(indices){
  const mime=pickMime();
  const canvas=$("#exportCanvas");
  if(mime===null||!canvas.captureStream){ showModal(t("export"),t("noExport"),[{label:t("close")}]); return; }
  if(playing){ setPlaying(false); activeVideo().pause(); }
  ensureAudio(); sources.forEach(hookAudio);
  if(audioCtx.state==="suspended") await audioCtx.resume();

  // 出力サイズ：最初のクリップの解像度（長辺1920まで）
  const first=srcOf(L(indices[0]));
  let W=first.w||1280, H=first.h||720; const k=Math.min(1,1920/Math.max(W,H));
  W=Math.round(W*k/2)*2; H=Math.round(H*k/2)*2;
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);

  const stream=canvas.captureStream(30);
  if(!muted) audioDest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
  const opts=mime?{mimeType:mime,videoBitsPerSecond:8_000_000}:{};
  const rec=new MediaRecorder(stream,opts);
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };

  const totalLen=indices.reduce((a,i)=>a+segLen(L(i)),0);
  let doneLen=0, cancelled=false;
  exporting={cancel:()=>{cancelled=true;}};
  showModal(t("exporting"),t("exportText"),[{label:t("cancel"),fn:()=>exporting&&exporting.cancel()}],true);

  let drawing=true, curV=null;
  const draw=()=>{
    if(!drawing) return;
    if(curV && curV.readyState>=2){
      const vw=curV.videoWidth, vh=curV.videoHeight, s=Math.min(W/vw,H/vh);
      const dw=vw*s, dh=vh*s;
      ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
      ctx.drawImage(curV,(W-dw)/2,(H-dh)/2,dw,dh);
    }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
  rec.start(1000);
  const savedRate=rate;

  for(const i of indices){
    if(cancelled) break;
    const s=L(i), src=srcOf(s), v=src.video;
    rec.state==="recording" && rec.pause && rec.pause();
    sources.forEach(x=>{ if(x.video!==v){ x.video.pause(); x.video.classList.remove("on"); } });
    v.classList.add("on"); v.playbackRate=1;
    await seekVideo(v,s.start);
    curV=v;
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    rec.state==="paused" && rec.resume();
    try{ await v.play(); }catch(e){}
    await new Promise(resolve=>{
      const tick=()=>{
        if(cancelled||v.currentTime>=s.end-0.02||v.ended){ v.pause(); resolve(); return; }
        setProgress((doneLen+Math.max(0,v.currentTime-s.start))/totalLen);
        setTimeout(tick,30);
      };
      tick();
    });
    doneLen+=segLen(s);
  }
  drawing=false;
  await new Promise(r=>{ rec.onstop=r; rec.stop(); });
  stream.getVideoTracks().forEach(tr=>tr.stop());
  rate=savedRate;
  exporting=null;
  if(cancelled){ hideModal(); await seekGlobal(0); return; }

  const type=rec.mimeType||mime||"video/webm";
  const ext=type.includes("mp4")?"mp4":"webm";
  const blob=new Blob(chunks,{type});
  const name=`45cutjoin_${new Date().toISOString().slice(0,19).replace(/[-:T]/g,"")}.${ext}`;
  const file=new File([blob],name,{type});
  const btns=[];
  if(navigator.canShare && navigator.canShare({files:[file]})){
    btns.push({label:t("share"),pri:true,fn:async()=>{ try{ await navigator.share({files:[file]}); }catch(e){} }});
  }
  btns.push({label:t("close")});
  download(blob,name);
  showModal(t("saved"),t("savedText"),btns);
  await seekGlobal(0);
}
function download(blob,name){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},60000);
}
