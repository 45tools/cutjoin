<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#E9EFEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="45 Cut&amp;Join">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<title>45 Cut &amp; Join</title>
<style>
:root{
  --bg:#E9EFEA; --panel:#FFFFFF; --ink:#13241A; --muted:#5A6D61; --line:#CFDAD2; --accent:#1C6A43; --accent-ink:#FFFFFF;
  --field:#2A7849; --clip:#2E8250; --sel:#FFE14D; --star:#FFE14D; --danger:#D7263D; --soft:#E5EFE8; --strong:#13241A; --strong-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0E1913; --panel:#17261D; --ink:#E5EFE8; --muted:#97AE9F; --line:#2A3D31; --accent:#58C389; --accent-ink:#0E1913; --soft:#1E3326; --strong:#E5EFE8; --strong-ink:#0E1913; --danger:#FF6B7A; }
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg)}
button,select,a,label{touch-action:manipulation}
html,body{margin:0}
body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 8px) env(safe-area-inset-right) 0 env(safe-area-inset-left);background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","PingFang TC","PingFang SC",system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button,select{font:inherit;color:inherit;cursor:pointer}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* 下のバーの選択欄は、選んだあとに枠を出さない（枠の端だけが縦線に見えていた） */
.dockbar select:focus,.dockbar select:focus-visible{outline:none}
.dockbar .seg.sel:focus-within{background:var(--soft)}
.wrap{max-width:900px;margin:0 auto;padding:0 0 calc(96px + env(safe-area-inset-bottom))}

/* 上の段（Multiと同じ並び：道具 → 元に戻す → 余白 → メニュー） */
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px}
.bar .sp{flex:1;min-width:4px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:40px;padding:0 12px;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;color:var(--ink);text-decoration:none}
.btn.icon{width:46px;padding:0}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.strong{background:var(--strong);border-color:var(--strong);color:var(--strong-ink);font-weight:700}
.btn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);flex:none}
.seg button,.seg label{border:0;background:transparent;min-height:38px;padding:0 9px;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--ink)}
.seg > * + *{border-left:1px solid var(--line)!important}
.seg button:disabled{opacity:.4}
.modes button .ic{width:18px;height:18px}
body[data-mode="watch"] .modes [data-mode="watch"],body[data-mode="cut"] .modes [data-mode="cut"],body[data-mode="star"] .modes [data-mode="star"]{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* メニュー（Multiと同じ形） */
.menu{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 64px);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 10px 30px rgba(10,30,18,.25);padding:6px;display:flex;flex-direction:column;min-width:250px;max-height:calc(100vh - 90px);overflow:auto}
.menu[hidden]{display:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.mi{border:0;background:transparent;text-align:left;min-height:44px;padding:0 14px;font-size:15px;font-weight:500;border-radius:9px;display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--ink);text-decoration:none}
.mi:active{background:var(--bg)}
.mi:disabled{opacity:.4}
.mi .v{margin-left:auto;color:var(--muted);font-size:13px}
.mi.danger{color:var(--danger)}
.mi.accent{color:var(--accent);font-weight:700}
.mi select{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 6px;font-size:13px;color:var(--ink)}
.scrim{position:fixed;inset:0;z-index:55}
.scrim[hidden]{display:none}

/* 動画（Multiのグラウンドと同じ緑の枠） */
.frame{margin:6px 6px 0;background:var(--field);border-radius:12px;padding:8px}
#stage{position:relative;background:#0E1913;border-radius:6px;overflow:hidden;aspect-ratio:16/9;touch-action:pan-y}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;visibility:hidden;pointer-events:none}
#stage video.on{visibility:visible}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#C9D8CE;text-align:center;padding:14px;background:#13241A}
#empty .big{font-size:15px;color:#FFFFFF;font-weight:700}
#empty .btn{min-height:46px;padding:0 20px;font-size:15px}
.linkbtn{background:none;border:none;color:#BFE5CF;font-size:13px;text-decoration:underline;padding:4px}
.ripple{position:absolute;top:0;bottom:0;width:40%;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}
.ripple.l{left:0;border-radius:0 50% 50% 0;background:radial-gradient(circle at 30% 50%,rgba(255,255,255,.2),transparent 70%)}
.ripple.r{right:0;border-radius:50% 0 0 50%;background:radial-gradient(circle at 70% 50%,rgba(255,255,255,.2),transparent 70%)}
.ripple.show{opacity:1}
.ripple span{background:rgba(0,0,0,.55);color:#fff;padding:8px 14px;border-radius:20px;font-weight:700;font-size:15px}
#centerIcon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:60px;height:60px;border-radius:30px;background:rgba(14,25,19,.65);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;pointer-events:none;padding:0 16px;white-space:nowrap;z-index:6}
#centerIcon.msg{font-size:14px;font-weight:700}
#centerIcon.show{opacity:1}
#holdBadge{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(14,25,19,.75);color:#fff;border-radius:10px;padding:4px 12px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
#holdBadge.show{opacity:1}
#holdBadge .ic{width:16px;height:16px}
#timeBadge{display:none}
#segBadge{position:absolute;right:8px;top:8px;background:rgba(14,25,19,.75);color:#fff;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700;pointer-events:none}
#fsBar{display:none}
body.fsmode{overflow:hidden}
body.fsmode #stage{position:fixed;inset:0;z-index:70;border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;height:100dvh}
body.fsmode #fsBar{display:flex;position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));gap:8px;align-items:center;z-index:5}
body.fsmode #fsBar{z-index:8;background:linear-gradient(transparent,rgba(0,0,0,.75));padding-top:26px;transition:background .3s}
body.fsmode #fsBar > *{transition:opacity .3s}
body.fsmode #fsBar.dim{background:transparent;pointer-events:none}
body.fsmode #fsBar.dim > *:not(#fsStar){opacity:0;pointer-events:none}
body.fsmode #fsBar.dim #fsStar{pointer-events:auto}
#fsClock{display:none}
body.fsmode #fsClock{display:block;position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));background:rgba(14,25,19,.6);color:#fff;border-radius:8px;padding:2px 8px;font-size:13px;z-index:7;pointer-events:none}
body.fsmode #segBadge{display:none}
#fsProg{position:absolute;left:16px;right:16px;top:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.18);touch-action:none}
#fsProg .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#58C389}
#fsProg .fmk{position:absolute;top:-5px;width:12px;height:18px;margin-left:-6px;color:#FFE14D;font-size:13px;line-height:18px;text-align:center;pointer-events:none}
body.fsmode #fsBar #fsStar .ic{width:28px;height:28px}
body.fsmode #fsBar #fsStar{width:56px;height:56px;border-radius:28px;padding:0;background:#FFE14D;border-color:#FFE14D;color:#13241A;font-weight:700;font-size:15px}
body.fsmode #fsBar .t{white-space:nowrap;font-size:17px}
@media (max-width:420px){body.fsmode #fsBar{gap:6px;padding-left:10px;padding-right:10px} body.fsmode #fsBar button{width:42px}}
#fsBar button{width:46px;height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
#fsBar #fsPlay{background:#1C6A43;border-color:#1C6A43}
#fsBar #fsStar{color:var(--star)}
#fsBar .t{flex:1;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;color:#fff}

/* 再生操作 */
.transport{display:flex;align-items:center;gap:6px;padding:10px 10px 0}
.transport .btn{min-height:44px}
.transport .btn.num{font-size:17px}
.time{flex:1;text-align:right;white-space:nowrap;font-size:26px}
.time .tot{font-weight:600;font-size:18px;color:var(--muted)}

/* タイムライン（白いパネル） */
.panel{margin:10px 10px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
#timeline{position:relative;height:50px;touch-action:none;border-radius:6px}
.seg-clip{position:absolute;top:0;bottom:0}
.seg{}
#timeline .seg{position:absolute;top:0;bottom:0;border-radius:6px;overflow:hidden;display:flex;align-items:flex-end;padding:0 6px 3px;color:#fff;background-size:cover;background-position:center;border:0}
#timeline .seg.sel{box-shadow:0 0 0 3px var(--sel);z-index:1}
#timeline .seg .lbl{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;text-shadow:0 0 3px rgba(0,0,0,.6)}
#playhead{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink);pointer-events:none;z-index:3}
#range{position:absolute;top:0;bottom:0;background:rgba(215,38,61,.3);border-left:3px solid var(--danger);border-right:3px solid var(--danger);pointer-events:none;display:none;z-index:2}
#range.on{display:block}
#range.noL{border-left:none}#range.noR{border-right:none}
.mk{position:absolute;top:0;bottom:0;width:2px;background:var(--star);z-index:2;pointer-events:none}
.mk::after{content:"★";position:absolute;top:-4px;left:-6px;font-size:13px;color:var(--star);text-shadow:0 0 3px #000}
.hlband{position:absolute;top:0;bottom:0;background:rgba(255,225,77,.5);pointer-events:none;z-index:1}
#selOn:not([hidden]){display:contents}
#selTitle{white-space:nowrap}
.selrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;min-height:32px}
.selrow .info{margin-left:auto;font-size:16px;font-weight:600;color:var(--muted);white-space:nowrap}
.selrow .btn{min-height:32px;padding:0 10px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px;padding:2px 2px 2px 10px;font-size:17px;background:var(--panel);color:var(--ink)}
.chip > span{cursor:pointer}
.chip button{width:32px;height:32px;border:0;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.chip button .ic{width:14px;height:14px}
.tip{margin:10px 14px 0;font-size:12px;line-height:1.6;color:var(--muted)}
#lenSum{margin:8px 2px 0;font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
[data-pane]{display:none}
body[data-mode="watch"] [data-pane="watch"],body[data-mode="cut"] [data-pane="cut"],body[data-mode="star"] [data-pane="star"]{display:block}
.foot{display:flex;justify-content:center;margin-top:20px}
.brand{color:var(--muted);font-size:11px;text-align:center}

/* 下の浮いたバー（Multiのペン操作バーと同じ形） */
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 8px calc(14px + env(safe-area-inset-bottom));z-index:20;pointer-events:none}
.dockbar{display:none;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 2px 10px rgba(10,30,18,.14);pointer-events:auto;max-width:100%}
.dockbar .btn{min-height:44px}
.dockbar .seg button{min-height:42px;width:44px;padding:0}
.dockbar .seg.sel select{border:0;background:transparent;min-height:42px;padding:0 6px;font-size:13px;color:var(--ink);-webkit-appearance:none;appearance:none;text-align:center}
.dockbar .seg.sel label{padding:0 2px 0 8px;font-size:12px;color:var(--muted)}
.dockbar .seg.sel label + select{border-left:0!important}
body[data-mode="watch"] #dockWatch,body[data-mode="cut"]:not(.ranging) #dockCut,body.ranging[data-mode="cut"] #dockRange,body[data-mode="star"] #dockStar{display:flex}
body.empty .dockbar{display:none!important}
.hide{display:none!important}

/* シート・ダイアログ */
.overlay{position:fixed;inset:0;background:rgba(10,30,18,.45);display:none;align-items:flex-end;justify-content:center;z-index:80}
.overlay.show{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 14px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;border:1px solid var(--line)}
.sheet h2{margin:0 0 12px;font-size:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;color:var(--ink)}
.opt .bub{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--accent);flex:none}
.opt.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.primary .bub{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.opt.primary small{color:inherit;opacity:.85}
.opt b{display:block;font-size:15px}
.opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.opt:disabled{opacity:.4}
.opts-lbl{color:var(--muted);font-size:12px;font-weight:700;margin:12px 2px 6px}
.seg2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg2 button{border:0;background:var(--panel);padding:9px 4px;font-size:12px;line-height:1.35;color:var(--ink)}
.seg2 button + button{border-left:1px solid var(--line)}
.seg2 button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin:12px 2px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.closeb{display:block;width:100%;margin-top:6px}
.help{line-height:1.7;font-size:14px}
.help h3{font-size:14px;margin:14px 0 4px;color:var(--accent)}
.help ol,.help ul{margin:0;padding-left:20px}
.help .note{background:var(--soft);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px;margin-top:6px}
#modal{position:fixed;inset:0;background:rgba(10,30,18,.45);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
#modal.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:420px;width:100%}
.card h2{margin:0 0 8px;font-size:17px}
.card p{color:var(--muted);font-size:13px;line-height:1.65;margin:6px 0;white-space:pre-line}
.bar2{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:12px 0}
.bar2 i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.mrow{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mrow .btn{min-height:46px;font-size:15px}
#exportCanvas{display:none}
</style>
</head>
<body data-mode="watch" class="empty">
<div class="bar">
  <div class="seg modes" role="group" aria-label="mode">
    <button data-mode="watch"><i class="ic" data-ic="eye"></i><span data-i="mWatch"></span></button>
    <button data-mode="cut"><i class="ic" data-ic="scissors"></i><span data-i="mCut"></span></button>
    <button data-mode="star"><i class="ic" data-ic="star"></i><span data-i="mStar"></span></button>
  </div>
  <button class="btn icon" id="undoBtn" aria-label="undo"><i class="ic" data-ic="undo"></i></button>
  <div class="sp"></div>
  <button class="btn icon" id="menuBtn" aria-label="menu" aria-expanded="false"><i class="ic" data-ic="menu"></i></button>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="menu" id="menu" role="menu" hidden>
  <button class="mi" id="addBtn" role="menuitem"><i class="ic" data-ic="plus"></i><span data-i="addMore"></span></button>
  <button class="mi" id="sortBtn" role="menuitem"><i class="ic" data-ic="clock"></i><span data-i="sortLong"></span></button>
  <button class="mi" id="snapBtn" role="menuitem"><i class="ic" data-ic="camera"></i><span data-i="snapLong"></span></button>
  <button class="mi" id="rangeMenuBtn" role="menuitem"><i class="ic" data-ic="eraser"></i><span data-i="rangeTitle"></span></button>
  <hr>
  <button class="mi" id="muteBtn" role="menuitemcheckbox"><i class="ic" id="muteIc" data-ic="sound"></i><span id="muteLbl"></span></button>
  <button class="mi" id="dateMenuBtn" role="menuitem"><span data-i="dateLbl"></span><span class="v" id="dateMenuV"></span></button>
  <button class="mi danger" id="newBtn" role="menuitem"><i class="ic" data-ic="refresh"></i><span data-i="startOver"></span></button>
  <hr>
  <label class="mi"><span data-i="langLbl"></span>
    <select id="lang" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh">简体中文</option></select>
  </label>
  <button class="mi" id="helpBtn" role="menuitem"><i class="ic" data-ic="help"></i><span data-i="helpLong"></span></button>
  <div class="mi" style="min-height:32px;font-size:12px;color:var(--muted)" id="verLbl"></div>
  <a class="mi accent" id="supportLink" role="menuitem" target="_blank" rel="noopener"><i class="ic" data-ic="heart"></i><span data-i="support"></span></a>
</div>

<div class="wrap">
  <div class="frame">
    <div id="stage">
      <div id="empty">
        <div class="big" data-i="emptyTitle"></div>
        <button class="btn primary" id="addFirst"><i class="ic" data-ic="film"></i><span data-i="addVideo"></span></button>
        <div data-i="emptySub" style="font-size:12px"></div>
        <button class="linkbtn" id="slowBtn" data-i="slowLink"></button>
      </div>
      <div class="ripple l" id="rl"><span>« 10s</span></div>
      <div class="ripple r" id="rr"><span>10s »</span></div>
      <div id="centerIcon"></div>
      <div id="holdBadge">2x <i class="ic" data-ic="ff"></i></div>
      <div id="timeBadge" hidden></div>
      <div id="segBadge" hidden></div>
      <div id="fsClock" class="num">0:00 / 0:00</div>
      <div id="fsBar">
        <div id="fsProg"><div class="fill" id="fsFill"></div></div>
      <button id="fsExit" aria-label="exit full screen"><i class="ic" data-ic="shrink"></i></button>
        <button id="fsBack" aria-label="-10s"><i class="ic" data-ic="back10"></i></button>
        <button id="fsPlay" aria-label="play"><i class="ic" data-ic="play"></i></button>
        <button id="fsFwd" aria-label="+10s"><i class="ic" data-ic="fwd10"></i></button>
        <span class="t" id="fsTime">0:00 / 0:00</span>
        <button id="fsStar" aria-label="mark"><i class="ic" data-ic="star"></i></button>
      </div>
    </div>
  </div>

  <div class="transport">
    <button class="btn icon num" id="back10" aria-label="-10s">−10</button>

// iPhone対策：動画要素を先に画面へ置いてから読み込む。
// メタデータが来なくても、MP4/MOVなら自前の解析結果（長さ）で先に進む。
async function loadSource(file){
  let mp4=null; try{ mp4=await MP4Cut.parse(file); }catch(e){ mp4=null; }
  const v=document.createElement("video");
  v.playsInline=true; v.muted=muted; v.preload="auto";
  v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline","");
  stage.insertBefore(v,$("#rl"));
  const url=URL.createObjectURL(file);
  v.src=url; try{ v.load(); }catch(e){}
  const meta=await new Promise(res=>{
    let done=false; const fin=x=>{ if(!done){ done=true; res(x); } };
    v.addEventListener("loadedmetadata",()=>fin("ok"),{once:true});
    v.addEventListener("error",()=>fin("error"),{once:true});
    setTimeout(()=>fin("timeout"),mp4?300:6000); // MP4/MOVは自前の解析で長さが分かるので待たない
  });

  if(!isFinite(dur)&&mp4&&meta!=="error") dur=mp4.duration;
  if(!isFinite(dur)||dur<=0){
    const code=v.error?(" code "+v.error.code):"";
    v.remove(); URL.revokeObjectURL(url);
    throw new Error(meta+code);
  }
  const created=(mp4&&mp4.created)||null;
  const src={id:uid++,name:file.name,file,mp4,url,duration:dur,video:v,color:COLORS[sources.length%COLORS.length],w:v.videoWidth,h:v.videoHeight,thumb:null,created};
  if(!src.w) v.addEventListener("loadedmetadata",()=>{ src.w=v.videoWidth; src.h=v.videoHeight; },{once:true});
  src.key=file.size+"|"+dur.toFixed(1);
  const saved=mkAll()[src.key]; src.markers=saved?saved.t.slice():[];
  sources.push(src);
  v.addEventListener("timeupdate",()=>onTime(src));
  v.addEventListener("pause",()=>{ if(playing&&v===activeVideo()&&!v.ended&&!advancing) setPlaying(false); });
  v.addEventListener("ended",()=>onEnded(src));

  return src;
}
function makeThumb(src){
  // 本体の動画に最初の映像が届いたら、そのコマをタイムライン用に縮小して使う（2本目の動画は開かない）
  const v=src.video;

    try{
      if(!v.videoWidth) return;
      const c=document.createElement("canvas"); const w=160, h=Math.round(160*(v.videoHeight/v.videoWidth||9/16));
      c.width=w; c.height=h; c.getContext("2d").drawImage(v,0,0,w,h);
      src.thumb=c.toDataURL("image/jpeg",.6); src.w=v.videoWidth; src.h=v.videoHeight; renderTimeline();
    }catch(e){}

}

function activeVideo(){ const s=segs[cur]; return s? srcOf(s).video : null; }

}
function seekVideo(v,time){

    v.currentTime=time;

}
function onTime(src){

function onEnded(src){ const s=segs[cur]; if(s&&s.src===src.id&&playing) advance(); }

}
function globalTime(){

async function seekGlobal(g){

function setPlaying(p){

function togglePlay(){

  if(globalTime()>=total()-0.1){ // 最後まで再生済みなら先頭へ（同期的に切り替え）
    const s0=segs[0], v0=srcOf(s0).video;

}
function startPlay(){

// 別のアプリへ切り替えたら止めておき、戻ったら動画の状態を確かめて立て直す

let lastTap={t:0,x:0,side:null}, tapTimer=null, chain=0;
function stageTap(clientX){
  if(!segs.length||exporting) return;

// タッチは touchend で処理して既定動作（ダブルタップ拡大）を止める。マウスは pointerup。
let touchStart=null;
// 長押しで2倍速（指を離すと元の速さに戻る）
let holdTimer=null, holding=false, holdPrevRate=1, rewinding=null;
function startHold(side){
  if(!segs.length||exporting) return;
  holding=true;
  const badge=$("#holdBadge");
  if(side==="l"){
    // 左側の長押し：止めて、少しずつ戻す（0.12秒ごとに0.24秒＝2倍速で巻き戻し）
    const wasPlaying=playing; if(playing){ setPlaying(false); activeVideo().pause(); }
    let busy=false;
    rewinding={wasPlaying,timer:setInterval(()=>{ if(busy) return; const g=globalTime(); if(g<=0.05) return; busy=true; seekGlobal(Math.max(0,g-0.24)).then(()=>{busy=false;}); },120)};
    badge.innerHTML=`<i class="ic">${ico("rw")}</i> 2x`;
  } else {
    holdPrevRate=rate; rate=2;
    const v=activeVideo(); if(v) v.playbackRate=2;

function endHold(){

const sideOf=x=>{ const r=stage.getBoundingClientRect(); return (x-r.left)<r.width*0.4?"l":"r"; };

  if(e.touches.length===1&&onStageEl(e.target)){ clearTimeout(holdTimer); const sd=sideOf(p.clientX); holdTimer=setTimeout(()=>startHold(sd),450); }

  segs.forEach((s,i)=>{

    d.style.left=(4+acc/T*W)+"px"; d.style.width=Math.max(4,segLen(s)/T*W-2)+"px";
    d.style.backgroundColor=src.color;

/* ===== 編集 ===== */
// 全体時刻 g の位置で切る（キーフレームに合わせる）。切れ目のセグメント番号を返す
function splitAtGlobal(g){
  let acc=0;
  for(let i=0;i<segs.length;i++){
    const s=segs[i], L=segLen(s);
    if(g<=acc+L+1e-6){
      const src=srcOf(s); let at=s.start+(g-acc);
      if(src.mp4) at=MP4Cut.snap(src.mp4,at);
      if(at-s.start<0.3) return i;
      if(s.end-at<0.3) return i+1;
      segs.splice(i,1,{id:uid++,src:s.src,start:s.start,end:at},{id:uid++,src:s.src,start:at,end:s.end});
      if(cur>i) cur++;
      return i+1;
    }
    acc+=L;
  }
  return segs.length;
}

const MK_KEY="cj_markers";

  const keys=Object.keys(all).sort((a,b)=>all[b].u-all[a].u); keys.slice(300).forEach(k=>delete all[k]); // 古いものだけ整理

function visibleMarks(){

const LENS=[0,2,3,5,8,10,15,20,30,45,60];
const hl={pre:+(localStorage.getItem("cj_pre")||10), post:+(localStorage.getItem("cj_post")||5)};
function stepLen(k,d){
  let i=LENS.indexOf(hl[k]); if(i<0) i=LENS.findIndex(v=>v>=hl[k]);
  i=Math.max(0,Math.min(LENS.length-1,i+d)); hl[k]=LENS[i];
  if(hl.pre+hl.post<2) hl[k]=LENS[Math.min(LENS.length-1,i+1)];
  try{ localStorage.setItem("cj_"+k,hl[k]); }catch(e){}
  renderLen();
}
function fillLenSel(sel,k){
  sel.innerHTML=LENS.map(v=>`<option value="${v}">${v}${t("secU")}</option>`).join(""); sel.value=hl[k];
  sel.onchange=()=>{ hl[k]=+sel.value; if(hl.pre+hl.post<2){ hl[k]=Math.max(2,hl[k]); sel.value=hl[k]; } try{ localStorage.setItem("cj_"+k,hl[k]); }catch(e){} renderMarks(); };
}
function renderLen(){
  const ps=$("#preSel"), qs=$("#postSel");
  if(ps.options.length!==LENS.length||ps.options[0].textContent!==LENS[0]+t("secU")){ fillLenSel(ps,"pre"); fillLenSel(qs,"post"); }
  ps.value=hl.pre; qs.value=hl.post;
  const n=visibleMarks().length;
  if(n&&!preview){ const {parts}=highlightParts(); const d=parts.reduce((a,p)=>a+segLen(p),0); $("#lenSum").textContent=t("lenSum").replace("{n}",n).replace("{d}",fmt(d)); }
  else $("#lenSum").textContent=t("lenSumNone").replace("{a}",hl.pre).replace("{b}",hl.post).replace("{c}",hl.pre+hl.post);
}
// ★の前後の範囲（全体時刻）→ 元動画上のパーツ
function highlightParts(){
  const pre=hl.pre, post=hl.post, T=total();
  const rs=[]; visibleMarks().forEach(m=>{ const a=Math.max(0,m.g-pre), b=Math.min(T,m.g+post);
    if(rs.length&&a<=rs[rs.length-1][1]) rs[rs.length-1][1]=Math.max(rs[rs.length-1][1],b); else rs.push([a,b]); });
  const parts=[]; let acc=0;
  segs.forEach(s=>{ const Ls=segLen(s), src=srcOf(s);
    for(const [a0,b0] of rs){ const a=Math.max(a0,acc), b=Math.min(b0,acc+Ls); if(b-a<0.2) continue;
      let st=s.start+(a-acc), en=s.start+(b-acc);
      if(src.mp4){ st=Math.max(s.start,MP4Cut.snap(src.mp4,st)); if(en<s.end-0.05) en=Math.min(s.end,MP4Cut.snap(src.mp4,en)); }
      if(en-st>=0.3) parts.push({id:uid++,src:s.src,start:st,end:en}); }
    acc+=Ls; });
  return {parts,count:rs.length};
}

function ensureAudio(){

function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
const L=x=>typeof x==="number"?segs[x]:x;
function fastable(indices){
  const ms=[...new Set(indices.map(i=>srcOf(L(i)).mp4))];
  if(ms.some(m=>!m)) return "noparse";
  return MP4Cut.compatible(ms) ? "ok" : "mixed";
}
function buildFile(indices,name){
  const parts=indices.map(i=>{ const s=L(i); return {m:srcOf(s).mp4,start:s.start,end:s.end}; });
  const r=MP4Cut.build(parts,{mute:muted,dateNow});
  return new File([r.blob],`${name}.${r.ext}`,{type:r.mime});
}
function saveJoined(indices,tag){
  if(!indices.length) return;
  if(playing){ setPlaying(false); activeVideo().pause(); }
  const ok=fastable(indices);
  if(ok!=="ok"){ askCompat(ok,()=>doExport(indices)); return; }
  try{ showResult([buildFile(indices,"45cutjoin_"+(tag?tag+"_":"")+stamp())]); }
  catch(e){ askCompat("noparse",()=>doExport(indices)); }
}
function saveParts(indices,tag){
  if(!indices.length) return;
  if(playing){ setPlaying(false); activeVideo().pause(); }
  const bad=indices.filter(i=>fastable([i])!=="ok");
  if(bad.length){ askCompat("noparse",()=>doExport(bad)); return; }
  const st=stamp();
  showResult(indices.map((i,k)=>buildFile([i],`45cutjoin_${tag?tag+"_":""}${st}_${String(k+1).padStart(2,"0")}`)));
}
function askCompat(kind,go){
  showModal(t("compatTitle"),kind==="mixed"?t("compatText"):t("parseFail"),[{label:t("cancel")},{label:t("compatGo"),pri:true,fn:()=>setTimeout(go,0)}]);
}
// 共有できる形を探す（iPhoneは種類の判定が厳しいので、別の種類名でも試す）
function shareable(files){
  if(!navigator.share||!navigator.canShare) return null;
  const tries=[files,
    files.map(f=>f.type.startsWith("video/")?new File([f],f.name.replace(/\.\w+$/,".mp4"),{type:"video/mp4"}):f),
    files.map(f=>f.type.startsWith("video/")?new File([f],f.name.replace(/\.\w+$/,".mov"),{type:"video/quicktime"}):f)];
  for(const fs of tries){ try{ if(navigator.canShare({files:fs})) return fs; }catch(e){} }
  return null;
}
function showResult(files,kind){
  const btns=[], sh=shareable(files);
  if(sh) btns.push({label:"📷 "+t("savePhotos"),pri:true,keep:true,fn:()=>{
    navigator.share({files:sh}).catch(e=>{ if(e&&e.name!=="AbortError") showModal(t("fastTitle"),t("shareFail"),[{label:t("saveFiles"),fn:()=>files.forEach((f,i)=>setTimeout(()=>download(f,f.name),i*700))},{label:t("close")}]); });
  }});
  btns.push({label:"📁 "+t("saveFiles"),pri:!sh,keep:true,fn:()=>files.forEach((f,i)=>setTimeout(()=>download(f,f.name),i*700))});
  btns.push({label:t("close")});
  const sz=files.reduce((a,f)=>a+f.size,0)/1048576;
  const head=`${files.length>1?files.length+" files · ":""}${sz.toFixed(1)} MB${kind!=="snap"&&muted?t("mutedNote"):""}\n`;
  const body=kind==="snap"?t("snapText"):t("fastText");
  showModal(kind==="snap"?t("snapTitle"):t("fastTitle"),head+(sh?body:t("noShare")),btns);
}

async function doExport(indices){
  const mime=pickMime();
  const canvas=$("#exportCanvas");
  if(mime===null||!canvas.captureStream){ showModal(t("export"),t("noExport"),[{label:t("close")}]); return; }
  if(playing){ setPlaying(false); activeVideo().pause(); }
  ensureAudio(); sources.forEach(hookAudio);
  if(audioCtx.state==="suspended") await audioCtx.resume();

  // 出力サイズ：最初のクリップの解像度（長辺1920まで）
  const first=srcOf(L(indices[0]));
  let W=first.w||1280, H=first.h||720; const k=Math.min(1,1920/Math.max(W,H));
  W=Math.round(W*k/2)*2; H=Math.round(H*k/2)*2;
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);

  const stream=canvas.captureStream(30);
  if(!muted) audioDest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
  const opts=mime?{mimeType:mime,videoBitsPerSecond:8_000_000}:{};
  const rec=new MediaRecorder(stream,opts);
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };

  const totalLen=indices.reduce((a,i)=>a+segLen(L(i)),0);
  let doneLen=0, cancelled=false;
  exporting={cancel:()=>{cancelled=true;}};
  showModal(t("exporting"),t("exportText"),[{label:t("cancel"),fn:()=>exporting&&exporting.cancel()}],true);

  let drawing=true, curV=null;
  const draw=()=>{
    if(!drawing) return;
    if(curV && curV.readyState>=2){
      const vw=curV.videoWidth, vh=curV.videoHeight, s=Math.min(W/vw,H/vh);
      const dw=vw*s, dh=vh*s;
      ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
      ctx.drawImage(curV,(W-dw)/2,(H-dh)/2,dw,dh);
    }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
  rec.start(1000);
  const savedRate=rate;

  for(const i of indices){
    if(cancelled) break;
    const s=L(i), src=srcOf(s), v=src.video;
    rec.state==="recording" && rec.pause && rec.pause();
    sources.forEach(x=>{ if(x.video!==v){ x.video.pause(); x.video.classList.remove("on"); } });
    v.classList.add("on"); v.playbackRate=1;
    await seekVideo(v,s.start);
    curV=v;
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    rec.state==="paused" && rec.resume();
    try{ await v.play(); }catch(e){}
    await new Promise(resolve=>{
      const tick=()=>{
        if(cancelled||v.currentTime>=s.end-0.02||v.ended){ v.pause(); resolve(); return; }
        setProgress((doneLen+Math.max(0,v.currentTime-s.start))/totalLen);
        setTimeout(tick,30);
      };
      tick();
    });
    doneLen+=segLen(s);
  }
  drawing=false;
  await new Promise(r=>{ rec.onstop=r; rec.stop(); });
  stream.getVideoTracks().forEach(tr=>tr.stop());
  rate=savedRate;
  exporting=null;
  if(cancelled){ hideModal(); await seekGlobal(0); return; }

  const type=rec.mimeType||mime||"video/webm";
  const ext=type.includes("mp4")?"mp4":"webm";
  const blob=new Blob(chunks,{type});
  const name=`45cutjoin_${new Date().toISOString().slice(0,19).replace(/[-:T]/g,"")}.${ext}`;
  const file=new File([blob],name,{type});
  const btns=[];
  if(navigator.canShare && navigator.canShare({files:[file]})){
    btns.push({label:t("share"),pri:true,fn:async()=>{ try{ await navigator.share({files:[file]}); }catch(e){} }});
  }
  btns.push({label:t("close")});
  download(blob,name);
  showModal(t("saved"),t("savedText"),btns);
  await seekGlobal(0);
}
function download(blob,name){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},60000);
}

/* ===== モーダル ===== */
function showModal(title,text,buttons,progress){
  $("#mTitle").textContent=title; $("#mText").textContent=text;
  $("#mBar").style.display=progress?"block":"none"; setProgress(0);
  const row=$("#mRow"); row.innerHTML="";
  buttons.forEach(b=>{ const el=document.createElement("button"); el.className="btn"+(b.pri?" pri":""); el.textContent=b.label;
    el.onclick=()=>{ if(b.fn) b.fn(); if(!b.keep&&!progress) hideModal(); }; row.appendChild(el); });
  $("#modal").classList.add("show");
}
function hideModal(){ $("#modal").classList.remove("show"); }
function setProgress(p){ $("#mFill").style.width=Math.round(Math.min(1,p)*100)+"%"; }
function toast(msg){ const c=$("#centerIcon"); c.classList.add("msg"); c.textContent=msg; c.classList.add("show"); clearTimeout(c._t); c._t=setTimeout(()=>c.classList.remove("show"),1600); }

/* ===== 起動 ===== */
$("#supportLink").href=SUPPORT_URL; $("#verLbl").textContent="45tools · ver "+APP_VER;
setPlaying(false);
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
applyLang(); setMode((()=>{ try{ return localStorage.getItem("cj_mode")||"watch"; }catch(e){ return "watch"; } })());
try{ if(!localStorage.getItem("cj_help")){ localStorage.setItem("cj_help","1"); openSheet("#helpSheet"); } }catch(e){}
// 新しい版が出たらすぐ使う（アプリを開いたとき・戻ったときに確認。編集中は勝手に再読み込みしない）
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded) return; if(!(segs.length)){ reloaded=true; location.reload(); } });
}
// テスト用フック
window.__cc={get rangeIn(){return rangeIn},get muted(){return muted},get segs(){return segs},get sources(){return sources},seekGlobal,globalTime,total,skip,get cur(){return cur}};
